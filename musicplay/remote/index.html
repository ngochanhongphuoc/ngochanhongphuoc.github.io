<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2A0B11">
<meta name="robots" content="noindex">
<title>Remote nhạc tiệc | Ngọc Hân &amp; Hồng Phước</title>
<link rel="icon" href="../../assets/icons/music.svg" type="image/svg+xml">
<style>
  @font-face { font-family: "Be Vietnam Pro"; font-weight: 400; font-display: swap; src: url(../../assets/fonts/be-vietnam-pro-400-vietnamese.woff2) format("woff2"); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
  @font-face { font-family: "Be Vietnam Pro"; font-weight: 400; font-display: swap; src: url(../../assets/fonts/be-vietnam-pro-400-latin.woff2) format("woff2"); }
  @font-face { font-family: "Be Vietnam Pro"; font-weight: 600; font-display: swap; src: url(../../assets/fonts/be-vietnam-pro-600-vietnamese.woff2) format("woff2"); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
  @font-face { font-family: "Be Vietnam Pro"; font-weight: 600; font-display: swap; src: url(../../assets/fonts/be-vietnam-pro-600-latin.woff2) format("woff2"); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 600; font-display: swap; src: url(../../assets/fonts/cormorant-garamond-vietnamese.woff2) format("woff2"); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 600; font-display: swap; src: url(../../assets/fonts/cormorant-garamond-latin.woff2) format("woff2"); }

  :root {
    --bg: #1C070B; --card: rgba(255,255,255,0.06); --line: rgba(246,241,230,0.14);
    --ink: #F6F1E6; --muted: rgba(246,241,230,0.68); --accent: #E3B6A8; --wine: #8E2C3C; --red: #D6334A; --ok: #3DD68C; --warn: #F2B544;
    --foot-h: 92px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { touch-action: manipulation; }
  body {
    min-height: 100dvh; background: radial-gradient(120% 60% at 50% 0%, #4A1520 0%, var(--bg) 70%) fixed, var(--bg);
    color: var(--ink); font-family: "Be Vietnam Pro", system-ui, sans-serif; font-size: 16px;
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .wrap {
    max-width: 640px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) calc(var(--foot-h) + env(safe-area-inset-bottom) + 20px) calc(env(safe-area-inset-left) + 16px);
  }

  /* Đầu trang */
  .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .head h1 { font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 1.6rem; line-height: 1.1; }
  .head small { display: block; font-size: 0.78rem; color: var(--muted); }
  .conn { display: flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
  .conn i { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .conn.ok i { background: var(--ok); box-shadow: 0 0 0 4px rgba(61,214,140,0.2); }
  .conn.warn i { background: var(--warn); }
  .conn.bad i { background: var(--red); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }

  .alert { margin-bottom: 12px; padding: 12px 14px; border-radius: 14px; background: rgba(242,181,68,0.16); border: 1px solid rgba(242,181,68,0.5); font-size: 0.9rem; line-height: 1.45; }
  .alert[hidden] { display: none; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 14px; }
  .label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }

  /* Bài đang phát */
  .now .title { font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 1.65rem; line-height: 1.15; }
  .now .artist { color: var(--muted); font-size: 0.9rem; margin-top: 2px; min-height: 1.2em; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; background: rgba(255,255,255,0.1); text-transform: none; }
  .chip.on { background: rgba(61,214,140,0.18); color: #9FF0C6; }
  .chip.padon { background: rgba(214,51,74,0.25); color: #FFC2CB; }
  .bar { margin-top: 14px; height: 28px; display: flex; align-items: center; cursor: pointer; }
  .bar div { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.15); overflow: hidden; }
  .bar b { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; }
  .times { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Nút bật/tắt */
  .toggles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .tg { min-height: 52px; border-radius: 14px; background: rgba(255,255,255,0.07); border: 1px solid var(--line); font-size: 0.82rem; font-weight: 600; line-height: 1.2; padding: 6px; }
  .tg.on { background: rgba(227,182,168,0.22); border-color: var(--accent); }
  .tg span { display: block; font-size: 1.15rem; }

  /* Pad */
  .group { margin-top: 14px; }
  .group:first-of-type { margin-top: 4px; }
  .group h3 { font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .group h3 i { width: 10px; height: 10px; border-radius: 50%; }
  .cells { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .pad {
    position: relative; min-height: 64px; padding: 10px 12px; border-radius: 14px; text-align: left;
    background: var(--c); border: 2px solid transparent; font-weight: 600; font-size: 0.92rem; line-height: 1.25;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.25); transition: transform 0.08s;
  }
  .pad:active { transform: scale(0.96); }
  .pad .k { position: absolute; top: 6px; right: 8px; font-size: 0.68rem; opacity: 0.6; text-transform: uppercase; }
  .pad .fx { font-size: 0.7rem; opacity: 0.75; display: block; font-weight: 400; margin-top: 2px; }
  .pad.playing { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,0.25), 0 0 18px rgba(255,255,255,0.35); animation: glow 1.2s ease-in-out infinite; }
  .pad.playing::after { content: "♪ đang phát"; display: block; font-size: 0.7rem; margin-top: 3px; font-weight: 600; }
  @keyframes glow { 50% { box-shadow: 0 0 0 3px rgba(255,255,255,0.1), 0 0 6px rgba(255,255,255,0.15); } }

  /* Danh sách bài */
  details summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: "▾"; font-size: 1.1rem; color: var(--muted); transition: transform 0.2s; }
  details[open] summary::after { transform: rotate(180deg); }
  .search { width: 100%; margin: 12px 0 8px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,0.25); color: var(--ink); font: inherit; font-size: 16px; -webkit-user-select: text; user-select: text; }
  .songs { display: grid; gap: 4px; }
  .song { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 11px 10px; border-radius: 12px; }
  .song:active { background: rgba(255,255,255,0.1); }
  .song.cur { background: rgba(227,182,168,0.16); }
  .song .no { width: 26px; flex: none; text-align: right; font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .song .t { font-weight: 600; font-size: 0.92rem; }
  .song .a { display: block; font-size: 0.78rem; color: var(--muted); font-weight: 400; }

  /* Thanh nút cố định dưới cùng */
  .foot {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 10px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 16px);
    background: rgba(20,5,8,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line);
  }
  .foot .row { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1.3fr 1fr 1.2fr; gap: 10px; align-items: center; }
  .fb { height: 64px; border-radius: 18px; background: rgba(255,255,255,0.1); border: 1px solid var(--line); display: grid; place-items: center; }
  .fb:active { transform: scale(0.95); }
  .fb svg { width: 28px; height: 28px; fill: currentColor; }
  .fb.main { height: 72px; background: var(--ink); color: #2A0B11; border: 0; }
  .fb.main svg { width: 34px; height: 34px; }
  .fb.stop { background: var(--red); border: 0; font-weight: 600; font-size: 0.85rem; line-height: 1.15; text-align: center; }
  .fb.stop:disabled { background: rgba(255,255,255,0.06); color: var(--muted); }
  .fb:disabled { opacity: 0.5; }

  .toast { position: fixed; left: 50%; bottom: calc(var(--foot-h) + env(safe-area-inset-bottom) + 14px); transform: translateX(-50%); z-index: 30; background: #111; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; opacity: 0; transition: opacity 0.2s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }

  .msg { min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: 24px; }
  .msg div { max-width: 340px; }
  .msg .ic { font-size: 3.6rem; }
  .msg h2 { margin: 10px 0 8px; font-size: 1.3rem; }
  .msg p { color: var(--muted); line-height: 1.5; }

  @media (min-width: 520px) { .cells { grid-template-columns: repeat(3, 1fr); } }
  /* Nằm trong trang Màn hình tiệc (screen/remote): trang ngoài đã có tiêu đề + chấm kết nối */
  body.embed .head { display: none; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="../../shared/firebase-config.js"></script>
<script type="module">
  import { CONFIGURED, db, ref, set, onValue, roomRef, signIn, watchServerTime, serverNow, serverTimestamp, randomId, escapeHtml, tidyUrl } from '../../shared/live.js';
  import { claimControl, saveMcSession } from '../../shared/remote.js';
  tidyUrl();
  if (window.self !== window.top) document.body.classList.add('embed');

  const app = document.getElementById('app');
  const params = new URLSearchParams(location.search);
  const pin = (params.get('pin') || '').replace(/\D/g, '');
  const key = params.get('key') || '';
  let st = null;          // trạng thái máy LED gửi lên
  let pads = [];          // nhóm pad
  let tracks = [];        // danh sách bài
  let online = true;      // điện thoại còn nối Firebase
  let built = false;

  const ICON = {
    play: '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>',
    pause: '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>',
    prev: '<svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>',
    next: '<svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>',
  };
  const REPEAT = { all: ['🔁', 'Lặp cả list'], one: ['🔂', 'Lặp 1 bài'], off: ['➡️', 'Không lặp'] };
  const $ = (id) => document.getElementById(id);
  const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const list = (x) => (Array.isArray(x) ? x : Object.values(x || {}));

  const toast = (msg) => {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), 1600);
  };
  const message = (icon, title, sub = '') => {
    built = false;
    app.innerHTML = `<div class="msg"><div><div class="ic">${icon}</div><h2>${title}</h2><p>${sub}</p></div></div>`;
  };

  if (!CONFIGURED) message('🛠️', 'Chưa cấu hình Firebase');
  else if (!pin || !key) message('📱', 'Thiếu mã điều khiển', 'Trên máy phát nhạc (LED) bấm nút 📱 rồi quét mã QR bằng điện thoại này, hoặc vào trang /mc nhập mã phòng.');
  else start();

  async function start() {
    message('⏳', 'Đang kết nối...');
    let uid;
    try { uid = await signIn(); } catch (e) { message('😢', 'Không kết nối được', escapeHtml(e.message)); return; }
    watchServerTime();
    if (!(await claimControl(pin, uid, key))) {
      message('🔒', 'Mã điều khiển không đúng', 'Quét lại mã QR (nút 📱 trên máy phát nhạc), hoặc vào trang /mc nhập lại mã phòng.');
      return;
    }
    saveMcSession(pin, key, 'music');
    onValue(ref(db, '.info/connected'), (snap) => { online = snap.val() === true; updateConn(); });
    onValue(roomRef(pin, 'type'), (snap) => {
      if (!snap.exists()) message('👋', 'Phòng đã đóng', 'Mở lại trình phát nhạc trên máy LED rồi quét mã QR mới.');
      else if (!built) build();
    });
    onValue(roomRef(pin, 'state'), (snap) => { st = snap.val(); if (built) update(); });
    onValue(roomRef(pin, 'pads'), (snap) => { pads = list(snap.val()).map((g) => ({ ...g, pads: list(g.pads) })); if (built) renderPads(); });
    onValue(roomRef(pin, 'tracks'), (snap) => { tracks = list(snap.val()); if (built) renderSongs(); });
    setInterval(tick, 500);
    keepAwake();
  }

  // ---------- Gửi lệnh: điện thoại chỉ ghi lệnh, máy LED tự làm ----------
  async function send(type, arg) {
    if (navigator.vibrate) navigator.vibrate(30);
    try {
      await set(roomRef(pin, 'command'), { type, id: randomId(10), arg: arg ?? null, at: serverTimestamp() });
    } catch (e) {
      toast('Không gửi được lệnh, thử lại nha');
    }
  }

  function build() {
    built = true;
    app.innerHTML = `<div class="wrap">
      <div class="head">
        <div><h1>🎵 Remote nhạc tiệc</h1><small>Phòng ${pin}</small></div>
        <div class="conn" id="conn"><i></i><span>...</span></div>
      </div>
      <div class="alert" id="tapAlert" hidden>👆 Trình duyệt trên máy LED đang chặn phát tiếng. Nhờ người ở máy <b>chạm màn hình hoặc bấm phím bất kỳ 1 lần</b>, sau đó điều khiển từ điện thoại bình thường.</div>
      <section class="card now">
        <div class="label">Đang phát <span class="chip" id="stChip">...</span></div>
        <div class="title" id="title">...</div>
        <div class="artist" id="artist"></div>
        <div class="bar" id="bar"><div><b id="fill"></b></div></div>
        <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
        <div class="toggles">
          <button class="tg" data-cmd="shuffle"><span>🔀</span>Ngẫu nhiên</button>
          <button class="tg" data-cmd="repeat" id="repBtn"><span>🔁</span>Lặp cả list</button>
          <button class="tg" data-cmd="padLoop"><span>♾️</span>Lặp pad</button>
        </div>
      </section>
      <section class="card">
        <div class="label">🎛️ Pad nghi lễ</div>
        <div id="pads"></div>
      </section>
      <section class="card">
        <details id="songBox">
          <summary><span class="label" style="margin:0">📋 Danh sách bài <span class="chip" id="songCount">0</span></span></summary>
          <input class="search" id="search" type="search" placeholder="Tìm bài hát, ca sĩ..." autocomplete="off">
          <div class="songs" id="songs"></div>
        </details>
      </section>
    </div>
    <nav class="foot"><div class="row">
      <button class="fb" data-cmd="prev" aria-label="Bài trước">${ICON.prev}</button>
      <button class="fb main" data-cmd="toggle" id="playBtn" aria-label="Phát / Dừng">${ICON.play}</button>
      <button class="fb" data-cmd="next" aria-label="Bài tiếp">${ICON.next}</button>
      <button class="fb stop" id="stopPads" disabled>■ Dừng pad</button>
    </div></nav>`;

    app.addEventListener('click', onClick);
    $('search').addEventListener('input', renderSongs);
    $('bar').addEventListener('click', (e) => {
      if (!st || !st.dur) return;
      const r = e.currentTarget.getBoundingClientRect();
      const sec = Math.round(((e.clientX - r.left) / r.width) * st.dur);
      send('seek', sec);
      toast('Tua tới ' + fmt(sec));
    });
    renderPads();
    renderSongs();
    update();
  }

  function onClick(e) {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    if (b.id === 'stopPads') {
      if (confirm('Dừng tất cả pad đang phát?')) send('stopPads');
      return;
    }
    if (b.dataset.pad) { send('pad', b.dataset.pad); return; }
    if (b.dataset.track) {
      const t = tracks[+b.dataset.track] || {};
      // Đang phát nhạc thì hỏi lại trước khi đổi bài (tránh bấm nhầm giữa tiệc)
      if (st && (st.playing || (st.pads || []).length) && !confirm(`Phát ngay "${t.t}"?\nBài đang phát và pad sẽ dừng.`)) return;
      send('track', +b.dataset.track);
      return;
    }
    if (b.dataset.cmd) send(b.dataset.cmd);
  }

  function padName(id) {
    const [g, i] = String(id).split('-').map(Number);
    return pads[g] && pads[g].pads[i] ? pads[g].pads[i].n : '';
  }

  function renderPads() {
    const box = $('pads');
    if (!box) return;
    if (!pads.length) { box.innerHTML = '<p style="color:var(--muted);font-size:0.9rem">Đang tải pad từ máy LED...</p>'; return; }
    box.innerHTML = pads.map((g, gi) => `<div class="group">
      <h3><i style="background:${escapeHtml(g.dot || '#fff')}"></i>${escapeHtml(g.name)}</h3>
      <div class="cells">${g.pads.map((p, i) => `<button class="pad" data-pad="${gi}-${i}" style="--c:${escapeHtml(g.color || '#5A1622')}">
        ${p.k ? `<span class="k">${escapeHtml(p.k)}</span>` : ''}${escapeHtml(p.n)}${p.sfx ? '<span class="fx">✨ hiệu ứng, phát chồng</span>' : ''}
      </button>`).join('')}</div>
    </div>`).join('');
    update();
  }

  function renderSongs() {
    const box = $('songs');
    if (!box) return;
    $('songCount').textContent = tracks.length;
    const q = $('search').value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
    const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
    box.innerHTML = tracks.map((t, i) => (!q || norm(t.t + ' ' + t.a).includes(q))
      ? `<button class="song" data-track="${i}"><span class="no">${i + 1}</span><span class="t">${escapeHtml(t.t)}<span class="a">${escapeHtml(t.a || '')}</span></span></button>` : '').join('')
      || '<p style="color:var(--muted);padding:8px">Không có bài nào</p>';
    markSong();
  }
  function markSong() {
    document.querySelectorAll('.song').forEach((el) => el.classList.toggle('cur', !!st && +el.dataset.track === st.idx));
  }

  // Vẽ lại phần thay đổi theo trạng thái máy LED
  function update() {
    if (!built) return;
    updateConn();
    if (!st) return;
    $('title').textContent = st.title || '—';
    $('artist').textContent = st.artist || '';
    const playingPads = st.pads || [];
    const chip = $('stChip');
    if (playingPads.length) { chip.className = 'chip padon'; chip.textContent = '🎛️ Pad: ' + playingPads.map(padName).filter(Boolean).join(', '); }
    else if (st.playing) { chip.className = 'chip on'; chip.textContent = '▶ Đang phát'; }
    else { chip.className = 'chip'; chip.textContent = '⏸ Đang dừng'; }
    $('playBtn').innerHTML = st.playing ? ICON.pause : ICON.play;
    $('stopPads').disabled = !playingPads.length;
    $('tapAlert').hidden = !st.needTap;
    document.querySelector('[data-cmd="shuffle"]').classList.toggle('on', !!st.shuffle);
    document.querySelector('[data-cmd="padLoop"]').classList.toggle('on', !!st.padLoop);
    const rep = REPEAT[st.repeat] || REPEAT.all;
    $('repBtn').innerHTML = `<span>${rep[0]}</span>${rep[1]}`;
    $('repBtn').classList.toggle('on', st.repeat !== 'off');
    document.querySelectorAll('.pad').forEach((el) => el.classList.toggle('playing', playingPads.includes(el.dataset.pad)));
    markSong();
    tick();
  }

  // Thời gian chạy tiếp trên điện thoại giữa 2 lần máy LED gửi trạng thái
  function tick() {
    if (!built || !st) return;
    const cur = Math.min(st.dur || 0, st.cur + (st.playing ? Math.max(0, serverNow() - st.at) / 1000 : 0));
    $('cur').textContent = fmt(cur);
    $('dur').textContent = fmt(st.dur);
    $('fill').style.width = st.dur ? (cur / st.dur) * 100 + '%' : '0';
    updateConn();
  }

  function updateConn() {
    const el = $('conn');
    if (!el) return;
    let cls = 'ok', text = 'Đã kết nối';
    if (!online) { cls = 'bad'; text = 'Mất mạng'; }
    else if (!st || serverNow() - st.at > 20000) { cls = 'warn'; text = 'Máy LED chưa mở'; }
    if (el.dataset.s !== cls) { el.dataset.s = cls; el.className = 'conn ' + cls; el.querySelector('span').textContent = text; }
  }

  // Giữ màn hình điện thoại sáng trong lúc điều khiển
  async function keepAwake() {
    if (!('wakeLock' in navigator)) return;
    const req = async () => { try { await navigator.wakeLock.request('screen'); } catch (e) { /* trình duyệt không cho thì thôi */ } };
    await req();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') req(); });
  }
</script>
</body>
