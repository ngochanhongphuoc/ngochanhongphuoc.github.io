<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C8102E">
<title>Vé Loto | Ngọc Hân & Hồng Phước</title>
<link rel="icon" href="../../assets/icons/ticket.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Ma+Shan+Zheng&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lottery.css">
<link rel="stylesheet" href="../../shared/couple-bg.css">
<style>
  .screen { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: 16px; }
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 12px 0; }
  .brand { font-size: 2.5rem; }
  h1 { font-size: 1.45rem; font-weight: 800; line-height: 1.3; }
  .sub { opacity: 0.9; line-height: 1.5; max-width: 340px; }
  .top { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 0.9rem; gap: 8px; }
  .me { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,226,154,0.15); border-radius: 9999px; padding: 4px 12px 4px 6px; max-width: 65%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .me .ani { font-size: 1.3rem; }
  .card { background: var(--cream); color: var(--ink); border-radius: 22px; padding: 20px; width: 100%; max-width: 420px; text-align: left; box-shadow: 0 0 0 4px var(--gold), 0 14px 34px rgba(0,0,0,0.3); }
  .card label { display: block; font-weight: 700; font-size: 0.85rem; margin: 4px 0 8px; color: var(--red); }
  .input { width: 100%; padding: 14px 16px; border: 2px solid #EBCB9A; border-radius: 14px; font: 700 1.1rem Montserrat, sans-serif; color: var(--ink); outline: none; background: #fff; }
  .input:focus { border-color: var(--red); }
  .pin-input { text-align: center; letter-spacing: 0.3em; font-size: 1.6rem; }
  .animals { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; }
  .animal { aspect-ratio: 1; border: 2px solid #EBCB9A; border-radius: 14px; background: #fff; font-size: 1.8rem; cursor: pointer; }
  .animal.on { border-color: var(--red); background: #FFE8D6; transform: scale(1.08); }
  .err { color: #B3261E; font-weight: 600; font-size: 0.85rem; min-height: 1.2em; margin: 8px 0; }
  .card .btn { width: 100%; }
  .avatar { font-size: 5rem; line-height: 1; }

  /* Tấm vé */
  .ticket {
    position: relative; width: 100%; max-width: 400px; border-radius: 20px; padding: 18px 16px 20px; text-align: center;
    background: linear-gradient(160deg, #FFF9E8, var(--cream)); color: var(--ink);
    box-shadow: 0 0 0 4px var(--gold), 0 0 0 8px var(--red-deep), 0 18px 40px rgba(0,0,0,0.4);
  }
  .ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 26px; height: 26px; margin-top: -13px; border-radius: 9999px; background: var(--red-deep); }
  .ticket::before { left: -17px; } .ticket::after { right: -17px; }
  .ticket .head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; color: var(--red); font-size: 0.85rem; letter-spacing: 0.06em; }
  .ticket .han { font-size: 2.6rem; color: var(--red); line-height: 1; }
  .ticket .digits { font-size: clamp(2.1rem, 11vw, 3.2rem); margin: 14px 0 8px; }
  .ticket .owner { font-weight: 700; font-size: 0.9rem; opacity: 0.8; }
  .stamp { position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%) rotate(-14deg); border: 4px solid #8B1A1A; color: #8B1A1A; border-radius: 12px; padding: 4px 16px; font-size: 1.9rem; font-weight: 800; letter-spacing: 0.1em; background: rgba(255,246,220,0.75); animation: pop 0.4s ease; }
  .status { font-size: 1.15rem; font-weight: 800; }
  .pill { background: rgba(0,0,0,0.22); border-radius: 9999px; padding: 8px 16px; font-weight: 700; }
  .win-han { font-size: 6rem; line-height: 1; animation: pop 0.8s ease; filter: drop-shadow(0 0 24px rgba(255,200,80,0.7)); }
  .list { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 400px; }
  .list .row { background: rgba(0,0,0,0.22); border-radius: 14px; padding: 10px 14px; text-align: left; }
  .list .row b { color: var(--gold-light); }
  .mine { box-shadow: inset 0 0 0 2px var(--gold); }
  .help-btn { border: 0; background: rgba(255,226,154,0.18); color: var(--gold-light); border-radius: 9999px; padding: 5px 11px; font: 700 0.8rem Montserrat, sans-serif; cursor: pointer; white-space: nowrap; }

  /* Vé lô tô 3×3 */
  .ticket .lt-grid { font-size: clamp(13px, 4.2vw, 18px); margin: 14px 0 10px; }
  .lastcall { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.22); border-radius: 9999px; padding: 6px 8px 6px 18px; font-weight: 700; }
  .lastcall b { width: 58px; height: 58px; border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center; font-size: 1.8rem; color: var(--red-deep); background: radial-gradient(circle at 32% 28%, #fff 0, var(--gold-light) 30%, var(--gold) 62%, var(--gold-deep) 100%); box-shadow: 0 0 0 3px var(--red-deep), 0 0 0 5px var(--gold); }
  .lastcall b.rolling { animation: shake 0.25s linear infinite; }
  .status b { color: var(--gold-light); }
  .mini-ladder { width: 100%; max-width: 420px; font-size: 0.85rem; }
</style>
</head>
<body class="xs">
<div id="app"></div>

<script src="../../shared/firebase-config.js"></script>
<script type="module">
  import {
    CONFIGURED, EMU, roomRef, get, set, onValue, serverTimestamp,
    signIn, escapeHtml, unlockAudio, sfx, burst,
    tidyUrl,
    avatarHtml, avatarPickerHtml, DEFAULT_AVATARS,
  } from '../../shared/live.js';
  import {
    PRIZES, ALL_NUMS, ROW_TEXT, ticketOf, parseTicket, callsOf, stageOf, rowsDone, progress, winnersAt,
    ticketGridHtml, ladderHtml, howToHtml, lanterns, COUPLE,
    prizeName, prizeShort,
  } from '../lottery.js';
  import { L, initLang, onLangChange } from '../../shared/i18n.js';
  initLang();
  const BASE = tidyUrl();

  const app = document.getElementById('app');
  let pin = (new URLSearchParams(location.search).get('pin') || '').replace(/\D/g, '');
  let uid = null;
  let room = null;
  let chosenAnimal = DEFAULT_AVATARS[Math.floor(Math.random() * DEFAULT_AVATARS.length)];
  let prev = { calls: -1, hits: 0, rows: 0, won: '' }; // để phát âm thanh khi có số mới
  let view = '';

  lanterns();
  if (!CONFIGURED) {
    app.innerHTML = `<div class="screen"><div class="center"><h1>${L('Game chưa sẵn sàng', 'The game is not ready yet')}</h1><p class="sub">${L('Cô dâu chú rể chưa cấu hình xong, quay lại sau nhé!', 'Please check back a little later!')}</p></div></div>`;
  } else {
    start();
  }

  async function start() {
    app.innerHTML = '<div class="screen"><div class="center"><div class="spinner"></div></div></div>';
    try { uid = await signIn(); } catch (e) {
      app.innerHTML = `<div class="screen"><div class="center"><h1>${L('Không kết nối được 😢', 'Could not connect 😢')}</h1><p class="sub">${escapeHtml(e.message)}</p></div></div>`;
      return;
    }
    if (pin) openRoom(); else renderPinForm();
  }

  let lastPinError = '';
  function renderPinForm(error = '') {
    lastPinError = error;
    view = 'pin';
    app.innerHTML = `<div class="screen"><div class="center">
      <div class="brand couple stack">${COUPLE}</div>
      <h1>${L('Nhập mã phòng lô tô 🧧', 'Enter the lô tô room code 🧧')}</h1>
      <div class="card">
        <label for="pinInput">${L('Mã phòng (6 số trên màn hình lớn)', 'Room code (6 digits on the big screen)')}</label>
        <input class="input pin-input" id="pinInput" inputmode="numeric" maxlength="6" autocomplete="off" value="${pin}">
        <div class="err">${escapeHtml(error)}</div>
        <button class="btn" id="goBtn">${L('Vào phòng', 'Join')}</button>
      </div>
    </div></div>`;
    const input = document.getElementById('pinInput');
    const go = () => { pin = input.value.replace(/\D/g, ''); if (pin.length === 6) openRoom(); else renderPinForm(L('Mã phòng gồm 6 chữ số nha', 'The room code has 6 digits')); };
    document.getElementById('goBtn').onclick = go;
    input.onkeydown = (e) => { if (e.key === 'Enter') go(); };
  }

  async function openRoom() {
    const r = (await get(roomRef(pin))).val();
    if (!r) { renderPinForm(L('Không tìm thấy phòng, kiểm tra lại mã nha', 'Room not found, please check the code')); return; }
    // Mã của game khác: chuyển sang trang nhập mã chung
    if (r.type !== 'lottery') { location.replace(new URL('../../quiz/join/', BASE).href + `?pin=${pin}${EMU ? '&emu=1' : ''}`); return; }
    const url = new URL(location.href);
    url.search = `?pin=${pin}${EMU ? '&emu=1' : ''}`;
    history.replaceState(null, '', url);
    onValue(roomRef(pin), (s) => { room = s.val(); render(); });
  }

  function renderJoin(error = '') {
    view = 'join';
    const nameValue = document.getElementById('nameInput')?.value || localStorage.getItem('kh_name') || '';
    app.innerHTML = `<div class="screen"><div class="center">
      <div class="brand couple stack">${COUPLE}</div>
      <div class="han gold-text" style="font-size:3rem;line-height:1">囍</div>
      <h1>${L('Nhận vé lô tô', 'Get your lô tô ticket')}</h1>
      <div class="card">
        <label for="nameInput">${L('Tên hiển thị', 'Display name')}</label>
        <input class="input" id="nameInput" maxlength="20" autocomplete="off" placeholder="${L('VD: Tuấn bàn 5', 'e.g. Tom table 5')}" value="${escapeHtml(nameValue)}">
        <label style="margin-top:14px">${L('Chọn avatar', 'Choose an avatar')}</label>
        ${avatarPickerHtml(chosenAnimal)}
        <div class="err" id="joinErr">${escapeHtml(error)}</div>
        <button class="btn" id="joinBtn">${L('Nhận vé 🧧', 'Get ticket 🧧')}</button>
      </div>
      <button class="help-btn" data-help>${L('❓ Cách chơi', '❓ How to play')}</button>
    </div></div>`;
    app.querySelectorAll('.animal').forEach((b) => {
      b.onclick = () => { chosenAnimal = b.dataset.a; app.querySelectorAll('.animal').forEach((x) => x.classList.toggle('on', x === b)); };
    });
    document.getElementById('joinBtn').onclick = join;
  }

  async function join() {
    unlockAudio();
    const name = document.getElementById('nameInput').value.trim().replace(/\s+/g, ' ');
    const errEl = document.getElementById('joinErr');
    if (!name) { errEl.textContent = L('Nhập tên đã nha!', 'Please enter your name!'); return; }
    if (Object.values(room.players || {}).some((p) => p.name.toLowerCase() === name.toLowerCase())) {
      errEl.textContent = L('Tên này có người dùng rồi, thêm chút gì cho khác nha 😄', 'That name is taken, try adding something to it 😄');
      return;
    }
    const btn = document.getElementById('joinBtn');
    btn.disabled = true;
    try {
      await set(roomRef(pin, `players/${uid}`), { name, animal: chosenAnimal, score: 0, joinedAt: serverTimestamp() });
      localStorage.setItem('kh_name', name);
      sfx.join();
    } catch (e) {
      btn.disabled = false;
      errEl.textContent = L('Không vào được phòng, thử lại nha!', 'Could not join, please try again!');
    }
  }

  const topBar = (me, extra = '') => `<div class="top"><span class="me"><span class="ani">${avatarHtml(me.animal)}</span>${escapeHtml(me.name)}</span><span>${extra} <button class="help-btn" data-help>${L('❓ Cách chơi', '❓ How to play')}</button></span></div>`;

  // Bảng cách chơi: gắn ngoài #app để không bị mất khi màn hình vẽ lại
  function showHelp() {
    if (document.querySelector('.help-modal')) return;
    const box = document.createElement('div');
    box.className = 'help-modal';
    box.innerHTML = `<div class="box"><h2>${L('🧧 Cách chơi lô tô', '🧧 How to play lô tô')}</h2>${howToHtml()}
      <button class="btn" id="helpClose">${L('Đã hiểu, chơi thôi!', 'Got it, let\'s play!')}</button></div>`;
    document.body.appendChild(box);
    const close = () => box.remove();
    box.querySelector('#helpClose').onclick = close;
    box.onclick = (e) => { if (e.target === box) close(); };
  }
  document.addEventListener('click', (e) => { if (e.target.closest('[data-help]')) showHelp(); });
  const screen = (me, inner, extra = '') => `<div class="screen">${topBar(me, extra)}<div class="center">${inner}</div></div>`;

  // Giải mình đã trúng (nếu có)
  function myPrize() {
    for (let st = 0; st < PRIZES.length; st++) if (room.winners && room.winners[st] && room.winners[st][uid]) return st;
    return -1;
  }

  function ticketCard(me, t, called, last) {
    return `<div class="ticket">
      <div class="head"><span>${L('VÉ LÔ TÔ', 'LÔ TÔ TICKET')}</span><span class="han">囍</span><span>${L('VÒNG', 'ROUND')} ${Math.min(stageOf(room), PRIZES.length - 1) + 1}/${PRIZES.length}</span></div>
      ${ticketGridHtml(t, called, { last })}
      <div class="owner">${avatarHtml(me.animal)} ${escapeHtml(me.name)}</div>
    </div>`;
  }

  function render() {
    if (!room) { app.innerHTML = `<div class="screen"><div class="center"><h1>${L('Phòng đã bị xóa', 'This room was removed')}</h1><p class="sub">${L('Quét mã QR mới trên màn hình nha!', 'Scan the new QR code on the screen!')}</p></div></div>`; return; }
    if (room.movedTo) { app.innerHTML = `<div class="screen"><div class="center"><h1>${L('MC đã tạo phòng mới', 'The MC started a new room')}</h1><a class="btn" href="?pin=${room.movedTo}">${L('Vào phòng mới', 'Join new room')} ${room.movedTo}</a></div></div>`; return; }
    const me = room.players && room.players[uid];
    if (!me) {
      if (room.status === 'ended') { app.innerHTML = `<div class="screen"><div class="center"><h1>${L('Lô tô đã kết thúc 🧧', 'Lô tô has ended 🧧')}</h1><p class="sub">${L('Hẹn bạn ở trò chơi sau nha!', 'See you in the next game!')}</p></div></div>`; return; }
      if (view !== 'join') renderJoin();
      return;
    }
    view = 'room';
    const s = room.status;
    if (s === 'lobby') {
      app.innerHTML = screen(me, `<div class="avatar">${avatarHtml(me.animal)}</div><h1>${L('Bạn đã vào phòng! 🎉', 'You\'re in! 🎉')}</h1>
        <p class="sub">${L('Chờ MC phát vé nha. Vé có 3 hàng, mỗi hàng 3 số, giữ nguyên cả 4 vòng.', 'Wait for the MC to hand out tickets. Your ticket has 3 rows of 3 numbers and stays the same for all 4 rounds.')}</p>
        <div style="width:100%;max-width:420px">${howToHtml()}</div>`);
      return;
    }

    const t = ticketOf(me);
    if (!t) { app.innerHTML = screen(me, `<div class="spinner"></div><h1>${L('Đang phát vé cho bạn...', 'Getting your ticket...')}</h1>`); return; }
    const calls = callsOf(room);
    const called = new Set(calls);
    const last = calls.length ? calls[calls.length - 1] : null;
    const rows = parseTicket(t);
    const done = rowsDone(rows, called);
    const hits = rows.flat().filter((n) => called.has(n)).length;
    const mine = myPrize();
    const stage = stageOf(room);
    const extra = `🎲 ${calls.length}/${ALL_NUMS.length}`;

    if (s === 'ended') { renderEnded(me, t, called); return; }

    // Vừa trúng giải ở số này
    if (s === 'won' && mine >= 0 && room.lastWin && (room.lastWin.stages || []).includes(mine)) {
      const P = PRIZES[mine];
      app.innerHTML = screen(me, `<div class="win-han han gold-text">${P.han}</div>
        <h1 class="gold-text" style="font-size:2rem">${L('BẠN TRÚNG', 'YOU WON THE')} ${prizeName(P).toUpperCase()}!</h1>
        ${ticketCard(me, t, called, last)}
        <p class="sub">${L('Lên sân khấu nhận quà từ cô dâu chú rể nha 🧧', 'Come up to the stage to get your gift from the bride and groom 🧧')}</p>`, extra);
      if (prev.won !== `${pin}:${mine}`) {
        prev.won = `${pin}:${mine}`;
        sfx.fanfare();
        burst(['🧧', '🧨', '🎆', '✨', '💰'], 60);
        if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
      }
      return;
    }

    // Trạng thái của mình
    let status;
    if (room.spinning) status = L('Đang quay số... cầu may nào 🙏', 'Drawing a number... fingers crossed 🙏');
    else if (mine >= 0) status = L(`🎉 Bạn đã trúng <b>${prizeName(PRIZES[mine])}</b>! Chơi tiếp cho vui nha.`, `🎉 You won the <b>${prizeName(PRIZES[mine])}</b>! Keep playing for fun.`);
    else if (stage >= PRIZES.length) status = L(`Đã đủ ${PRIZES.length} giải 🧧`, `All ${PRIZES.length} prizes are won 🧧`);
    else {
      const P = PRIZES[stage];
      const pr = progress(rows, called, P.rows);
      if (!calls.length) status = stage ? L(`Vòng ${stage + 1}: số đã xóa, quay lại từ đầu với vé cũ của bạn 🍀`, `Round ${stage + 1}: numbers cleared, starting over with your same ticket 🍀`) : L('Đã nhận vé! Chờ MC quay số đầu tiên 🍀', 'Ticket received! Waiting for the first number 🍀');
      else if (pr.left === 0) status = L('Vé bạn đã KINH! Chờ TV công bố nha 🙏', 'Your ticket is KINH! Wait for the TV announcement 🙏');
      else if (pr.left === 1) status = L(`🔥 Bạn đang <b>chờ số ${pr.waiting.join(' hoặc ')}</b> để KINH, trúng ${prizeName(P)}!`, `🔥 You're <b>waiting for ${pr.waiting.join(' or ')}</b> to KINH and win the ${prizeName(P)}!`);
      else status = L(`Vòng ${stage + 1}/${PRIZES.length}: ai KINH đầu tiên trúng ${prizeName(P)}. Bạn còn thiếu ${pr.left} số.`, `Round ${stage + 1}/${PRIZES.length}: first KINH wins the ${prizeName(P)}. You need ${pr.left} more numbers.`);
    }
    const wonNote = s === 'won' && room.lastWin
      ? `<div class="pill">🎉 ${L('Số', 'Number')} ${room.lastWin.n}: ${(room.lastWin.stages || []).map((st) => `${winnersAt(room, st).map((w) => escapeHtml(w.name)).join(', ')} ${L('trúng', 'won')} ${prizeShort(PRIZES[st])}`).join(' · ')}</div>`
      : '';
    app.innerHTML = screen(me, `
      <div class="lastcall"><span>${L('Số vừa quay', 'Last number')}</span><b class="${room.spinning ? 'rolling' : ''}">${room.spinning ? '?' : (last === null ? '–' : last)}</b></div>
      ${ticketCard(me, t, called, room.spinning ? null : last)}
      <div class="status">${status}</div>
      ${wonNote}
      <div class="mini-ladder">${ladderHtml(room, avatarHtml, escapeHtml)}</div>`, extra);

    // Âm thanh khi có số mới
    if (prev.calls >= 0 && calls.length > prev.calls) {
      if (done > prev.rows) { sfx.correct(); if (navigator.vibrate) navigator.vibrate([120, 60, 120, 60, 240]); }
      else if (hits > prev.hits) { sfx.answer(); if (navigator.vibrate) navigator.vibrate(80); }
    }
    prev = { ...prev, calls: calls.length, hits, rows: done };
  }

  onLangChange(() => {
    if (!room) { if (view === 'pin') renderPinForm(lastPinError); return; }
    view = '';
    render();
  });

  function renderEnded(me, t, called) {
    app.innerHTML = screen(me, `<div class="han gold-text" style="font-size:4rem;line-height:1">囍</div>
      <h1>${L('Tổng kết lô tô', 'Lô tô results')}</h1>
      <div class="mini-ladder">${ladderHtml(room, avatarHtml, escapeHtml)}</div>
      ${ticketCard(me, t, called, null)}
      <p class="sub">${L('Cảm ơn bạn đã chơi cùng Ngọc Hân &amp; Hồng Phước! 💕', 'Thanks for playing with Ngọc Hân &amp; Hồng Phước! 💕')}</p>
      <a class="btn" href="${new URL('../../', BASE).href}">${L('Xem thiệp cưới', 'View the invitation')}</a>`);
  }
</script>
</body>
</html>
