<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ai Là Triệu Phú | Ngọc Hân & Hồng Phước</title>
<link rel="icon" href="../assets/icons/quiz.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/live.css">
<link rel="stylesheet" href="../shared/couple-bg.css">
<style>
  body { font-size: clamp(14px, 1.15vw, 20px); }
  .screen { min-height: 100vh; padding: 24px clamp(16px, 3vw, 48px); display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .brand { font-family: "Great Vibes", cursive; font-size: 2.2em; line-height: 1; }
  .icon-btn { background: rgba(255,255,255,0.15); border: 0; color: #fff; border-radius: 9999px; padding: 8px 14px; font: 600 0.85em Montserrat, sans-serif; cursor: pointer; }

  /* Bắt đầu */
  .setup { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; }
  .setup h1 { font-size: 2.6em; font-weight: 800; }
  .setup p { opacity: 0.85; max-width: 560px; line-height: 1.6; }

  /* Sảnh chờ */
  /* Sảnh chờ: người chơi | QR to ở giữa | nút */
  .lobby { flex: 1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: clamp(16px, 2.5vw, 40px); }
  .lobby-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
  .lobby-actions .btn { min-width: 260px; }
  .join-box { background: #fff; color: var(--ink); border-radius: 32px; padding: 20px 28px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.25); }
  .join-box .label { font-weight: 800; font-size: 1.4em; color: var(--deep); }
  #qr { display: flex; justify-content: center; margin: 14px 0; }
  /* QR to ở giữa màn hình: khoảng nửa chiều cao TV */
  #qr img, #qr canvas { width: min(54vh, 78vw, 560px) !important; height: auto !important; }
  .pin-label { font-size: 0.85em; color: #666; margin-top: 4px; }
  .pin { font-size: 3.4em; font-weight: 800; letter-spacing: 0.12em; color: var(--maroon); line-height: 1.1; }
  .lobby-right { align-self: stretch; display: flex; flex-direction: column; justify-content: center; }
  .lobby-right h2 { font-size: 1.8em; font-weight: 800; margin-bottom: 4px; }
  .lobby-right .hint { opacity: 0.75; font-size: 0.9em; margin-bottom: 16px; }
  .players { display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; max-height: 60vh; overflow: auto; }
  .chip { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.95); color: var(--ink); border: 0; border-radius: 9999px; padding: 8px 16px 8px 10px; font: 700 1.05em Montserrat, sans-serif; cursor: pointer; animation: popIn 0.35s ease; }
  .chip .ani { font-size: 1.5em; }
  .chip:hover { background: #FCEEF1; text-decoration: line-through; }
  .empty { opacity: 0.6; font-style: italic; padding: 30px 0; }
  .bottom-bar { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 12px; margin-top: auto; padding-top: 20px; position: sticky; bottom: 14px; z-index: 5; }

  /* Câu hỏi */
  .q-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
  .q-num { font-weight: 800; font-size: 1.2em; }
  .answered { text-align: right; font-weight: 700; }
  .answered b { font-size: 1.8em; display: block; line-height: 1; }
  .timer { width: 96px; height: 96px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-size: 2.4em; font-weight: 800;
    background: conic-gradient(#fff calc(var(--p) * 1%), rgba(255,255,255,0.2) 0); position: relative; }
  .timer::before { content: ""; position: absolute; inset: 8px; border-radius: 9999px; background: var(--deep); }
  .timer span { position: relative; }
  .timer.urgent::before { background: #7A1F3D; }
  .q-box { background: #fff; color: var(--ink); border-radius: 24px; padding: clamp(16px, 2vw, 28px); text-align: center; margin: 18px 0; box-shadow: 0 12px 30px rgba(0,0,0,0.2); }
  .q-box .emoji { font-size: 2.6em; }
  .q-box .text { font-size: clamp(1.4em, 2.6vw, 2.4em); font-weight: 800; line-height: 1.25; margin-top: 6px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; flex: 1; }
  .tile { position: relative; display: flex; align-items: center; gap: 16px; border-radius: 18px; padding: clamp(14px, 1.6vw, 24px); color: #fff; font-weight: 700; font-size: clamp(1.05em, 1.7vw, 1.6em); line-height: 1.3; box-shadow: 0 6px 0 rgba(0,0,0,0.2); overflow: hidden; transition: opacity 0.3s, transform 0.3s; }
  .tile .shape { font-size: 1.6em; flex: none; width: 1.4em; text-align: center; }
  .tile .count { margin-left: auto; font-size: 1.3em; font-weight: 800; flex: none; }
  .tile .bar { position: absolute; left: 0; bottom: 0; height: 6px; background: rgba(255,255,255,0.7); transition: width 0.6s ease; }
  .tile.dim { opacity: 0.35; }
  .tile.correct { transform: scale(1.02); outline: 5px solid #fff; }
  .tile .check { font-size: 1.4em; flex: none; }

  .reveal-info { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 16px; align-items: stretch; }
  .fastest, .explain { flex: 1 1 280px; background: rgba(255,255,255,0.15); border-radius: 18px; padding: 14px 18px; font-weight: 600; line-height: 1.5; }
  .fastest b { color: #FFE08A; }

  /* Bảng xếp hạng */
  .board { max-width: 900px; width: 100%; margin: 0 auto; display: grid; gap: 10px; }
  .board h2 { text-align: center; font-size: 2.2em; font-weight: 800; margin-bottom: 8px; }
  .row { display: grid; grid-template-columns: 2.4em 2.4em 1fr auto auto; align-items: center; gap: 12px; background: #fff; color: var(--ink); border-radius: 16px; padding: 12px 18px; font-weight: 700; font-size: 1.25em; animation: slideIn 0.4s ease both; }
  .row .rk { font-size: 1.3em; font-weight: 800; color: var(--deep); text-align: center; }
  .row .ani { font-size: 1.6em; text-align: center; }
  .row .gain { color: var(--deep); font-size: 0.8em; }
  .row .sc { font-size: 1.1em; font-weight: 800; min-width: 4.5em; text-align: right; }
  .row:nth-child(2) { animation-delay: 0.05s; } .row:nth-child(3) { animation-delay: 0.1s; } .row:nth-child(4) { animation-delay: 0.15s; } .row:nth-child(5) { animation-delay: 0.2s; } .row:nth-child(6) { animation-delay: 0.25s; }

  /* Bục vinh quang */
  .podium { display: flex; justify-content: center; align-items: flex-end; gap: clamp(8px, 2vw, 24px); margin: 10px 0 24px; }
  .step { width: clamp(110px, 18vw, 220px); text-align: center; animation: rise 0.8s ease both; }
  .step .ani { font-size: 3.4em; }
  .step .nm { font-weight: 800; font-size: 1.2em; margin: 4px 0; word-break: break-word; }
  .step .sc { opacity: 0.9; font-weight: 600; }
  .step .block { margin-top: 10px; border-radius: 16px 16px 0 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 12px; font-size: 2.6em; font-weight: 800; color: var(--ink); }
  .step.p1 .block { height: 220px; background: linear-gradient(#FFE08A, #E8B931); }
  .step.p2 .block { height: 160px; background: linear-gradient(#F1F1F1, #C9C9C9); }
  .step.p3 .block { height: 120px; background: linear-gradient(#F3C9A1, #CD8A4F); }
  .step.p3 { animation-delay: 0.6s; } .step.p2 { animation-delay: 1.4s; } .step.p1 { animation-delay: 2.4s; }
  .record { text-align: center; font-weight: 700; margin-bottom: 18px; animation: fadeIn 0.6s 3.2s both; }
  .record b { color: #FFE08A; }
  .full-list { max-width: 900px; margin: 0 auto; width: 100%; animation: fadeIn 0.6s 3.4s both; }

  /* Danh sách kết quả / trao quà */
  .results { max-width: 1000px; width: 100%; margin: 0 auto; }
  .results h2 { text-align: center; font-size: 2em; font-weight: 800; }
  .results .meta { text-align: center; opacity: 0.85; margin: 4px 0 16px; }
  .results-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 16px; }
  .table-wrap { background: #fff; color: var(--ink); border-radius: 20px; overflow: auto; box-shadow: 0 12px 30px rgba(0,0,0,0.15); }
  table.res { width: 100%; border-collapse: collapse; font-size: 1em; }
  table.res th { background: var(--blush); color: var(--deep); font-weight: 800; text-align: left; padding: 12px 14px; white-space: nowrap; }
  table.res td { padding: 10px 14px; border-top: 1px solid #F3D9E0; font-weight: 600; }
  table.res td.num, table.res th.num { text-align: right; white-space: nowrap; }
  table.res tr.top td { background: #FFF8E6; }
  table.res tr.given td { opacity: 0.45; text-decoration: line-through; }
  table.res input { width: 20px; height: 20px; accent-color: var(--main); cursor: pointer; }
  .history { width: 100%; max-width: 560px; display: grid; gap: 8px; margin-top: 10px; }
  .history h3 { font-size: 1em; opacity: 0.85; margin-bottom: 2px; }
  .history button { display: flex; justify-content: space-between; gap: 12px; width: 100%; background: rgba(255,255,255,0.2); color: #fff; border: 0; border-radius: 14px; padding: 12px 16px; font: 600 0.95em Montserrat, sans-serif; cursor: pointer; text-align: left; }
  .history button:hover { background: rgba(255,255,255,0.3); }
  .mc-modal { position: fixed; inset: 0; z-index: 60; background: rgba(60,20,40,0.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .mc-modal .box { background: #fff; color: var(--ink); border-radius: 28px; padding: 24px; text-align: center; max-width: 380px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
  .mc-modal h3 { font-size: 1.3em; margin-bottom: 4px; }
  .mc-modal p { font-size: 0.9em; opacity: 0.75; line-height: 1.5; }
  .mc-modal #mcQr { display: flex; justify-content: center; margin: 14px 0; }
  .mc-modal #mcQr img, .mc-modal #mcQr canvas { width: 100% !important; max-width: 260px; height: auto !important; }
  .mc-modal .warn { color: #A84D68; font-weight: 700; font-size: 0.85em; margin-bottom: 12px; }
  .mc-modal .btn { background: var(--main); color: #fff; }
  .mc-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.2); border-radius: 9999px; padding: 6px 12px; font-size: 0.8em; font-weight: 700; }

  @media print {
    body.live { background: #fff !important; color: #000; }
    .topbar, .results-actions, .petal, .piece { display: none !important; }
    .results h2, .results .meta { color: #000; }
    .table-wrap { box-shadow: none; }
  }

  @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes slideIn { from { transform: translateX(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes rise { from { transform: translateY(80px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  @media (max-width: 760px) {
    .lobby { grid-template-columns: 1fr; }
    .lobby-actions { align-items: stretch; }
    .lobby-actions .btn { min-width: 0; }
    .tiles { grid-template-columns: 1fr; }
    .timer { width: 72px; height: 72px; font-size: 1.8em; }
    .row { grid-template-columns: 2em 2em 1fr auto; font-size: 1em; }
    .row .gain { display: none; }
  }
</style>
</head>
<body class="live">
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="questions.js"></script>
<script src="../shared/firebase-config.js"></script>
<script type="module">
  import { controlKey, mcCodeHtml } from '../shared/remote.js';
  import {
    CONFIGURED, EMU, QUESTION_MS, CHOICES, db, ref, roomRef, get, set, update, remove, onValue, serverTimestamp, randomId,
    signIn, watchServerTime, serverNow, scoreFor, rankPlayers, fmtSec, fmtScore, escapeHtml,
    unlockAudio, setMuted, isMuted, sfx, startGameMusic, stopGameMusic, burst, petals,
    tidyUrl,
    avatarHtml, avatarText,
  } from '../shared/live.js';
  const BASE = tidyUrl();

  const QUESTIONS = window.QUESTIONS;
  const app = document.getElementById('app');
  const PIN_KEY = 'kh_host_pin';
  const HISTORY_KEY = 'kh_host_history'; // các phòng đã tạo trên máy này, để xem lại danh sách trao quà

  let uid = null;
  let pin = null;
  let room = null;
  let unsubscribe = null;
  let ending = false;
  let lastScene = '';
  let lastTickSec = null;
  let qrUrl = '';
  let overlay = false; // đang xem danh sách kết quả/lịch sử: không vẽ lại màn hình game
  let mcUrl = '';
  let lastCmdId = null;
  let cmdPrimed = false;
  let timerStarted = false;
  // Mã bí mật để điện thoại MC điều khiển TV (giữ nguyên qua các phòng, lưu trên máy TV)
  const ctrlKey = controlKey(); // mã MC 16 số, xem shared/remote.js

  if (!CONFIGURED) {
    app.innerHTML = `<div class="screen"><div class="setup">
      <div style="font-size:4em">🛠️</div><h1>Chưa cấu hình Firebase</h1>
      <p>Mở file <b>shared/firebase-config.js</b> và dán cấu hình Firebase vào (xem hướng dẫn trong <b>docs/firebase-setup.txt</b>).</p>
    </div></div>`;
  } else {
    petals(14);
    init();
  }

  const loadHistory = () => { try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch (e) { return []; } };
  function saveHistory(p) {
    const list = loadHistory().filter((x) => x.pin !== p);
    list.unshift({ pin: p, at: Date.now() });
    localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, 20)));
  }

  async function init() {
    app.innerHTML = '<div class="screen"><div class="setup"><div class="spinner"></div></div></div>';
    try {
      uid = await signIn();
    } catch (e) {
      app.innerHTML = `<div class="screen"><div class="setup"><h1>Không kết nối được 😢</h1><p>${escapeHtml(e.message)}</p><p>Kiểm tra đã bật "Anonymous" trong Firebase Authentication chưa.</p></div></div>`;
      return;
    }
    watchServerTime();

    // /quiz/solo: chỉ xem danh sách các phòng, không tạo phòng mới
    if (new URLSearchParams(location.search).get('view') === 'list') { renderListPage(); return; }

    // Mỗi lần mở trang: tạo phòng mới với mã QR mới.
    // Riêng khi game đang chơi dở (MC lỡ tải lại trang) thì vào lại đúng phòng đó, không mất điểm.
    const saved = localStorage.getItem(PIN_KEY);
    if (saved) {
      const r = (await get(roomRef(saved))).val();
      if (r && r.hostUid === uid && !['lobby', 'ended'].includes(r.status)) { attach(saved); return; }
      localStorage.removeItem(PIN_KEY);
      // Phòng chờ cũ chưa chơi: chuyển sang phòng mới (điện thoại MC tự đi theo) rồi xóa phòng cũ
      if (r && r.hostUid === uid && r.status === 'lobby') { createRoom({ from: saved, deleteOld: true }); return; }
    }
    createRoom();
  }

  function renderSetup() {
    app.innerHTML = `<div class="screen">
      <div class="topbar"><div class="brand couple"><span class="nm">Ngọc Hân</span> <span class="amp">&amp;</span> <span class="nm">Hồng Phước</span></div></div>
      <div class="setup">
        <div style="font-size:4.5em">🎮</div>
        <h1>Ai Là Triệu Phú</h1>
        <p>Mở trang này trên máy tính nối với TV hoặc máy chiếu. Khách quét mã QR bằng điện thoại để vào chơi, mỗi câu có 30 giây.</p>
        <button class="btn btn-big" id="createBtn">Tạo phòng chơi</button>
        <div class="history" id="history"></div>
      </div>
    </div>`;
    document.getElementById('createBtn').onclick = createRoom;
    fillHistory(document.getElementById('history'), renderSetup);
  }

  // Danh sách các phòng đã chơi trên máy này (bỏ qua phòng đang mở)
  function fillHistory(box, back) {
    const list = loadHistory().filter((x) => x.pin !== pin);
    if (!list.length) { box.innerHTML = '<h3>Chưa có phòng nào chơi xong trên máy này.</h3>'; return; }
    box.innerHTML = '<h3>📋 Xem lại kết quả các phòng đã chơi</h3>' + list.map((x) =>
      `<button data-pin="${x.pin}"><span>Phòng ${x.pin}</span><span>${new Date(x.at).toLocaleString('vi-VN')}</span></button>`).join('');
    box.querySelectorAll('button').forEach((b) => { b.onclick = () => openResults(b.dataset.pin, back); });
  }

  async function openResults(p, back) {
    const r = (await get(roomRef(p))).val();
    if (!r) { alert('Phòng này không còn dữ liệu.'); return; }
    renderResults(r, p, back);
  }

  // Xem lịch sử ngay từ sảnh chờ
  function renderHistoryScreen() {
    overlay = true;
    const back = () => { overlay = false; lastScene = ''; render(); };
    app.innerHTML = `<div class="screen">
      ${topbar()}
      <div class="setup">
        <h1>📋 Kết quả các phòng trước</h1>
        <div class="history" id="history"></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
          <button class="btn btn-ghost" id="clearBtn">🗑️ Xóa tất cả dữ liệu cũ</button>
          <button class="btn btn-ghost" id="backBtn">← Quay lại sảnh chờ</button>
        </div>
      </div>
    </div>`;
    bindCommon();
    fillHistory(document.getElementById('history'), renderHistoryScreen);
    document.getElementById('backBtn').onclick = back;
    document.getElementById('clearBtn').onclick = async () => { await clearAllHistory(); renderHistoryScreen(); };
  }

  // Trang /quiz/solo: các phòng đã tạo trên máy này + xem kết quả theo mã phòng (dùng được trên mọi máy)
  function renderListPage() {
    overlay = true;
    app.innerHTML = `<div class="screen">
      ${topbar()}
      <div class="setup">
        <h1>📋 Danh sách game</h1>
        <form id="pinForm" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
          <input id="pinInput" inputmode="numeric" maxlength="6" placeholder="Nhập mã phòng" autocomplete="off"
            style="padding:12px 18px;border:0;border-radius:9999px;font:700 1.1em Montserrat,sans-serif;text-align:center;letter-spacing:0.15em;width:220px">
          <button class="btn" type="submit">Xem kết quả</button>
        </form>
        <div class="history" id="history"></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
          <button class="btn btn-ghost" id="clearBtn">🗑️ Xóa tất cả dữ liệu cũ</button>
          <a class="btn" href="${BASE}">🎮 Tạo phòng chơi</a>
        </div>
      </div>
    </div>`;
    bindCommon();
    fillHistory(document.getElementById('history'), renderListPage);
    document.getElementById('pinForm').onsubmit = (e) => {
      e.preventDefault();
      const p = document.getElementById('pinInput').value.replace(/\D/g, '');
      if (p.length === 6) openResults(p, renderListPage); else alert('Mã phòng gồm 6 chữ số nha');
    };
    document.getElementById('clearBtn').onclick = async () => { await clearAllHistory(); renderListPage(); };
  }

  // Tạo phòng mới. opts.from: phòng cũ -> ghi "movedTo" để điện thoại MC tự chuyển theo;
  // opts.deleteOld: xóa phòng cũ (mất dữ liệu), ngược lại giữ lại để xem danh sách trao quà
  async function createRoom(opts = {}) {
    unlockAudio();
    overlay = true;
    app.innerHTML = '<div class="screen"><div class="setup"><div class="spinner"></div><p>Đang tạo phòng chơi...</p></div></div>';
    for (let i = 0; i < 10; i++) {
      const candidate = String(Math.floor(100000 + Math.random() * 900000));
      if ((await get(roomRef(candidate))).exists()) continue;
      await set(roomRef(candidate), {
        hostUid: uid, createdAt: serverTimestamp(), status: 'lobby', q: -1, qKey: '', total: QUESTIONS.length,
      });
      // Luật Firebase cũ chưa có controlKeys: game vẫn chạy, chỉ là điện thoại MC chưa điều khiển được
      try { await set(ref(db, `rooms/${candidate}/mcKey`), ctrlKey); } catch (e) { /* bỏ qua */ } // trang /mc đọc mã này theo mã phòng
      try { await set(ref(db, `controlKeys/${candidate}`), ctrlKey); } catch (e) { console.warn('Chưa cập nhật luật Firebase cho chế độ MC', e); }
      localStorage.setItem(PIN_KEY, candidate);
      saveHistory(candidate);
      if (opts.from) {
        const old = opts.from;
        try {
          await update(roomRef(old), opts.deleteOld ? { movedTo: candidate, deleting: true } : { movedTo: candidate, status: 'ended' });
        } catch (e) { /* phòng cũ đã bị xóa */ }
        if (opts.deleteOld) {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(loadHistory().filter((x) => x.pin !== old)));
          // Đợi vài giây cho điện thoại MC kịp chuyển sang phòng mới rồi mới xóa
          setTimeout(() => { remove(roomRef(old)).catch(() => {}); remove(ref(db, `controlKeys/${old}`)).catch(() => {}); }, 8000);
        }
      }
      attach(candidate);
      return;
    }
    overlay = false;
    renderSetup();
  }

  function attach(p) {
    pin = p;
    // Link ngắn /quiz/join cho mã QR gọn, dễ gõ tay
    const url = new URL('join/', BASE);
    url.search = `?pin=${pin}${EMU ? '&emu=1' : ''}`;
    qrUrl = url.href;
    const mc = new URL('host/', BASE);
    mc.search = `?pin=${pin}&key=${ctrlKey}${EMU ? '&emu=1' : ''}`;
    mcUrl = mc.href;
    overlay = false;
    lastScene = '';
    ending = false;
    lastPlayerCount = 0;
    cmdPrimed = false;
    if (unsubscribe) unsubscribe();
    unsubscribe = onValue(roomRef(pin), (snap) => {
      room = snap.val();
      if (!room) { localStorage.removeItem(PIN_KEY); renderSetup(); return; }
      handleCommand(room.command);
      if (!overlay) render();
    });
    if (!timerStarted) { timerStarted = true; setInterval(tickTimer, 200); }
  }

  // ---------- Lệnh từ điện thoại MC ----------
  // Mỗi lệnh kèm trạng thái lúc MC bấm; TV chỉ làm khi trạng thái còn khớp (tránh bấm 2 lần nhảy 2 câu)
  function handleCommand(cmd) {
    if (!cmd) { cmdPrimed = true; return; }
    if (!cmdPrimed) { cmdPrimed = true; lastCmdId = cmd.id; return; } // lệnh cũ từ trước khi mở trang
    if (cmd.id === lastCmdId) return;
    lastCmdId = cmd.id;
    if (cmd.status !== undefined && cmd.status !== room.status) return;
    if (cmd.q !== undefined && cmd.q !== room.q) return;
    const players = Object.keys(room.players || {}).length;
    switch (cmd.type) {
      case 'start': if (room.status === 'lobby' && players > 0) { sfx.start(); goQuestion(0); } break;
      case 'skip': endQuestion(); break;
      case 'board': update(roomRef(pin), { status: 'leaderboard' }); break;
      case 'next': if (room.q < QUESTIONS.length - 1) goQuestion(room.q + 1); break;
      case 'podium': update(roomRef(pin), { status: 'podium' }); break;
      case 'kick': if (cmd.uid) kick(cmd.uid, true); break;
      case 'reset': resetGame(true); break;
      case 'newroom': newRoom(true); break;
      default: break;
    }
  }

  function showMcQr() {
    const box = document.createElement('div');
    box.className = 'mc-modal';
    box.innerHTML = `<div class="box">
      <h3>🎤 Mã điều khiển cho MC</h3>
      <p>MC quét mã này bằng điện thoại để bấm qua câu, xem đáp án trước và xem kết quả.</p>
      <div id="mcQr"></div>
      ${mcCodeHtml(pin)}
      <div class="warn">⚠️ Chỉ cho MC xem, đừng để khách quét hoặc chép mã này!</div>
      <button class="btn" id="mcClose">Đóng</button>
    </div>`;
    document.body.appendChild(box);
    new QRCode(box.querySelector('#mcQr'), { text: mcUrl, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.M });
    const close = () => box.remove();
    box.querySelector('#mcClose').onclick = close;
    box.onclick = (e) => { if (e.target === box) close(); };
  }

  // ---------- Điều khiển game ----------
  async function goQuestion(i) {
    ending = false;
    lastTickSec = null;
    const item = QUESTIONS[i];
    await update(roomRef(pin), {
      status: 'question', q: i, qKey: String(i), qStartAt: serverTimestamp(), reveal: null,
      // Kèm bản tiếng Anh cho điện thoại người chơi chọn EN (màn TV vẫn hiện tiếng Việt)
      current: { emoji: item.emoji, q: item.q, options: item.options, qEn: item.qEn || null, optionsEn: item.optionsEn || null },
    });
  }

  async function endQuestion() {
    if (ending || !room || room.status !== 'question') return;
    ending = true;
    const i = room.q;
    const item = QUESTIONS[i];
    const qStartAt = room.qStartAt;
    // Đóng câu hỏi trước (luật Firebase chặn mọi câu trả lời sau thời điểm này), rồi mới chấm điểm
    await update(roomRef(pin), { status: 'reveal' });
    const answers = (await get(roomRef(pin, `answers/${i}`))).val() || {};
    const players = room.players || {};

    const updates = {};
    const counts = [0, 0, 0, 0];
    let fastest = null;
    const next = {};
    for (const [pid, p] of Object.entries(players)) {
      const a = answers[pid];
      const correct = Boolean(a) && a.choice === item.answer;
      const ms = a ? Math.max(0, a.at - qStartAt) : null;
      if (a) counts[a.choice]++;
      const streak = correct ? (p.streak || 0) + 1 : 0;
      const { base, bonus } = scoreFor(correct, ms, streak);
      const score = (p.score || 0) + base + bonus;
      const totalMs = (p.totalMs || 0) + (correct ? ms : 0);
      next[pid] = { ...p, score, totalMs };
      Object.assign(updates, {
        [`players/${pid}/score`]: score,
        [`players/${pid}/streak`]: streak,
        [`players/${pid}/totalMs`]: totalMs,
        [`players/${pid}/lastGain`]: base + bonus,
        [`players/${pid}/lastBonus`]: bonus,
        [`players/${pid}/lastResult`]: a ? (correct ? 'right' : 'wrong') : 'none',
        [`players/${pid}/lastMs`]: ms,
        [`players/${pid}/lastQ`]: i,
        [`players/${pid}/correct`]: (p.correct || 0) + (correct ? 1 : 0),
      });
      if (correct && (!fastest || ms < fastest.ms)) fastest = { uid: pid, name: p.name, animal: p.animal, ms };
    }
    rankPlayers(next).forEach((p, idx) => { updates[`players/${p.uid}/rank`] = idx + 1; });
    const answered = Object.keys(answers).filter((k) => players[k]).length;
    updates.reveal = { counts, fastest, answered, answer: item.answer, right: item.right, wrong: item.wrong, rightEn: item.rightEn || null, wrongEn: item.wrongEn || null };
    if (fastest && (!room.record || fastest.ms < room.record.ms)) updates.record = { ...fastest, q: i };
    await update(roomRef(pin), updates);
  }

  function kick(pid, skipConfirm = false) {
    const p = room.players && room.players[pid];
    if (!p || (!skipConfirm && !confirm(`Mời "${p.name}" ra khỏi phòng?`))) return;
    update(roomRef(pin), { [`players/${pid}`]: null, [`banned/${pid}`]: true });
  }

  async function resetGame(skipConfirm = false) {
    if (!skipConfirm && !confirm('Xóa toàn bộ người chơi, điểm và câu trả lời của phòng này, rồi tạo game mới với mã QR mới?\n\n(Danh sách trao quà của phòng này cũng bị xóa.)')) return;
    stopGameMusic();
    if (unsubscribe) { unsubscribe(); unsubscribe = null; }
    await createRoom({ from: pin, deleteOld: true });
  }

  // Xóa tất cả phòng cũ do máy này tạo
  async function clearAllHistory() {
    const list = loadHistory().filter((x) => x.pin !== pin);
    if (!list.length || !confirm(`Xóa vĩnh viễn dữ liệu của ${list.length} phòng cũ (người chơi, điểm, danh sách trao quà)?`)) return;
    for (const x of list) {
      try { await remove(roomRef(x.pin)); } catch (e) { /* phòng của máy khác hoặc đã xóa */ }
    }
    localStorage.setItem(HISTORY_KEY, JSON.stringify(loadHistory().filter((x) => x.pin === pin)));
    alert('Đã xóa dữ liệu các phòng cũ.');
  }

  // Phòng mới nhưng GIỮ kết quả phòng cũ (xem lại danh sách trao quà)
  async function newRoom(skipConfirm = false) {
    if (!skipConfirm && !confirm('Kết thúc phòng này và tạo phòng mới? (Kết quả phòng này vẫn được giữ lại)')) return;
    stopGameMusic();
    if (unsubscribe) { unsubscribe(); unsubscribe = null; }
    await createRoom({ from: pin, deleteOld: room.status === 'lobby' });
  }

  // Đồng hồ 30 giây: tự kết thúc khi hết giờ hoặc khi tất cả đã trả lời
  function tickTimer() {
    if (!room || room.status !== 'question' || typeof room.qStartAt !== 'number') return;
    const left = Math.max(0, room.qStartAt + QUESTION_MS - serverNow());
    const sec = Math.ceil(left / 1000);
    const el = document.getElementById('timer');
    if (el) {
      el.querySelector('span').textContent = sec;
      el.style.setProperty('--p', (left / QUESTION_MS) * 100);
      el.classList.toggle('urgent', sec <= 5);
    }
    if (sec !== lastTickSec) {
      lastTickSec = sec;
      if (sec > 0 && sec <= 10) sfx.tick(sec <= 5);
    }
    const total = Object.keys(room.players || {}).length;
    const answered = countAnswers();
    if (left <= 0) { if (!ending) sfx.timeUp(); endQuestion(); }
    else if (total > 0 && answered >= total) endQuestion();
  }

  function countAnswers() {
    const answers = (room.answers && room.answers[room.q]) || {};
    return Object.keys(answers).filter((k) => room.players && room.players[k]).length;
  }

  // ---------- Giao diện ----------
  function topbar(extra = '') {
    return `<div class="topbar">
      <div class="brand couple"><span class="nm">Ngọc Hân</span> <span class="amp">&amp;</span> <span class="nm">Hồng Phước</span></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">${extra}
        ${pin ? '<button class="icon-btn" id="resetBtn">🗑️ Xóa &amp; tạo game mới</button>' : ''}
      </div>
    </div>`;
  }

  function bindCommon() {
    const r = document.getElementById('resetBtn');
    if (r) r.onclick = () => resetGame();
  }

  function render() {
    const scene = `${room.status}:${room.q}`;
    const sceneChanged = scene !== lastScene;
    lastScene = scene;
    if (['lobby', 'question'].includes(room.status)) startGameMusic(room.status);
    else stopGameMusic();

    if (room.status === 'lobby') renderLobby(sceneChanged);
    else if (room.status === 'question') sceneChanged ? renderQuestion() : updateQuestion();
    else if (room.status === 'reveal') renderReveal(sceneChanged);
    else if (room.status === 'leaderboard') sceneChanged && renderLeaderboard();
    else if (room.status === 'podium') sceneChanged && renderPodium();
    bindCommon();
  }

  let lastPlayerCount = 0;
  function renderLobby(sceneChanged) {
    const players = rankPlayers(room.players).sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
    if (players.length > lastPlayerCount) sfx.join();
    lastPlayerCount = players.length;
    if (sceneChanged) {
      app.innerHTML = `<div class="screen">
        ${topbar()}
        <div class="lobby">
          <div class="lobby-right">
            <h2 id="pcount"></h2>
            <div class="hint">Bấm vào tên để mời người chơi ra khỏi phòng</div>
            <div class="players" id="plist"></div>
          </div>
          <div class="join-box">
            <div class="label">📱 Quét mã để vào chơi</div>
            <div id="qr"></div>
            <div class="pin-label">hoặc nhập mã phòng</div>
            <div class="pin">${pin}</div>
          </div>
          <div class="lobby-actions">
          <button class="btn btn-ghost" id="mcBtn">🎤 Mã điều khiển cho MC</button>
          <button class="btn btn-ghost" id="historyBtn">📋 Kết quả phòng trước</button>
          <button class="btn btn-big" id="startBtn">Bắt đầu ▶</button>
          </div>
        </div>
      </div>`;
      new QRCode(document.getElementById('qr'), { text: qrUrl, width: 600, height: 600, correctLevel: QRCode.CorrectLevel.M });
      document.getElementById('startBtn').onclick = () => { unlockAudio(); sfx.start(); goQuestion(0); };
      document.getElementById('historyBtn').onclick = renderHistoryScreen;
      document.getElementById('mcBtn').onclick = showMcQr;
    }
    document.getElementById('pcount').textContent = `${players.length} người chơi`;
    document.getElementById('startBtn').disabled = players.length === 0;
    const list = document.getElementById('plist');
    list.innerHTML = players.length
      ? players.map((p) => `<button class="chip" data-uid="${p.uid}"><span class="ani">${avatarHtml(p.animal)}</span>${escapeHtml(p.name)}</button>`).join('')
      : '<div class="empty">Đang chờ người chơi quét mã...</div>';
    list.querySelectorAll('.chip').forEach((c) => { c.onclick = () => kick(c.dataset.uid); });
  }

  function tilesHtml(item, reveal) {
    const max = reveal ? Math.max(1, ...reveal.counts) : 1;
    return item.options.map((text, i) => {
      const c = CHOICES[i];
      const cls = reveal ? (i === item.answer ? 'correct' : 'dim') : '';
      const extra = reveal
        ? `<span class="count">${reveal.counts[i]}</span>${i === item.answer ? '<span class="check">✔</span>' : ''}<span class="bar" style="width:${(reveal.counts[i] / max) * 100}%"></span>`
        : '';
      return `<div class="tile ${cls}" style="background:${c.color}"><span class="shape">${c.shape}</span><span>${escapeHtml(text)}</span>${extra}</div>`;
    }).join('');
  }

  function questionHead(timer) {
    return `<div class="q-head">
      <div class="q-num">Câu ${room.q + 1}/${QUESTIONS.length}</div>
      ${timer ? '<div class="timer" id="timer" style="--p:100"><span>30</span></div>' : '<div></div>'}
      <div class="answered"><b id="acount">${room.status === 'question' ? countAnswers() : (room.reveal ? room.reveal.answered : 0)}</b>đã trả lời</div>
    </div>`;
  }

  function renderQuestion() {
    const item = QUESTIONS[room.q];
    app.innerHTML = `<div class="screen">
      ${topbar('<button class="icon-btn" id="skipBtn">⏭ Hết giờ luôn</button>')}
      ${questionHead(true)}
      <div class="q-box"><div class="emoji">${item.emoji}</div><div class="text">${escapeHtml(item.q)}</div></div>
      <div class="tiles">${tilesHtml(item)}</div>
    </div>`;
    document.getElementById('skipBtn').onclick = endQuestion;
    startGameMusic('question');
    tickTimer();
  }

  function updateQuestion() {
    const el = document.getElementById('acount');
    if (el) el.textContent = countAnswers();
  }

  function renderReveal(sceneChanged) {
    const item = QUESTIONS[room.q];
    const rv = room.reveal;
    if (!rv) {
      if (sceneChanged) app.innerHTML = `<div class="screen">${topbar()}<div class="setup"><div class="spinner"></div><p>Đang chấm điểm...</p></div></div>`;
      return;
    }
    if (document.getElementById('revealDone')) return;
    sfx.correct();
    const f = rv.fastest;
    app.innerHTML = `<div class="screen" id="revealDone">
      ${topbar()}
      ${questionHead(false)}
      <div class="q-box"><div class="emoji">${item.emoji}</div><div class="text">${escapeHtml(item.q)}</div></div>
      <div class="tiles">${tilesHtml(item, rv)}</div>
      <div class="reveal-info">
        <div class="fastest">${f ? `⚡ Nhanh tay nhất: <b>${avatarHtml(f.animal)} ${escapeHtml(f.name)}</b> chốt đáp án đúng sau <b>${fmtSec(f.ms)}</b>` : '😅 Chưa ai trả lời đúng câu này!'}</div>
        <div class="explain">💬 ${escapeHtml(item.right)}</div>
      </div>
      <div class="bottom-bar"><button class="btn btn-big" id="nextBtn">Bảng xếp hạng →</button></div>
    </div>`;
    document.getElementById('nextBtn').onclick = () => update(roomRef(pin), { status: 'leaderboard' });
  }

  function rowHtml(p, i, showGain) {
    const streak = p.streak >= 2 ? ` 🔥${p.streak}` : '';
    return `<div class="row"><span class="rk">${i + 1}</span><span class="ani">${avatarHtml(p.animal)}</span><span>${escapeHtml(p.name)}${streak}</span>
      ${showGain ? `<span class="gain">${p.lastGain ? '+' + fmtScore(p.lastGain) : ''}</span>` : ''}<span class="sc">${fmtScore(p.score)}</span></div>`;
  }

  function renderLeaderboard() {
    const ranked = rankPlayers(room.players);
    const last = room.q >= QUESTIONS.length - 1;
    app.innerHTML = `<div class="screen">
      ${topbar()}
      <div class="board">
        <h2>🏆 Bảng xếp hạng</h2>
        ${ranked.slice(0, 5).map((p, i) => rowHtml(p, i, true)).join('') || '<div class="empty" style="text-align:center">Chưa có người chơi</div>'}
      </div>
      <div class="bottom-bar"><button class="btn btn-big" id="nextBtn">${last ? 'Xem kết quả chung cuộc 🏆' : 'Câu tiếp theo →'}</button></div>
    </div>`;
    document.getElementById('nextBtn').onclick = () => {
      if (last) update(roomRef(pin), { status: 'podium' });
      else goQuestion(room.q + 1);
    };
  }

  function renderPodium(quiet = false) {
    const ranked = rankPlayers(room.players);
    const step = (p, n) => p
      ? `<div class="step p${n}"><div class="ani">${avatarHtml(p.animal)}</div><div class="nm">${escapeHtml(p.name)}</div><div class="sc">${fmtScore(p.score)} điểm</div><div class="block">${n}</div></div>`
      : '';
    const r = room.record;
    app.innerHTML = `<div class="screen">
      ${topbar('<button class="icon-btn" id="listBtn">📋 Danh sách trao quà</button><button class="icon-btn" id="newBtn">🔁 Phòng mới</button>')}
      <div class="podium">${step(ranked[1], 2)}${step(ranked[0], 1)}${step(ranked[2], 3)}</div>
      <div class="record">${r ? `⚡ Tay nhanh nhất cả game: <b>${avatarHtml(r.animal)} ${escapeHtml(r.name)}</b>, đúng câu ${r.q + 1} chỉ sau <b>${fmtSec(r.ms)}</b>` : ''}</div>
      <div class="full-list board">${ranked.slice(3).map((p, i) => rowHtml(p, i + 3, false)).join('')}</div>
    </div>`;
    document.getElementById('newBtn').onclick = () => newRoom();
    document.getElementById('listBtn').onclick = () => { overlay = true; renderResults(room, pin, () => { overlay = false; renderPodium(true); }); };
    if (quiet) {
      // Quay lại từ danh sách: hiện ngay, không chạy lại hiệu ứng & nhạc
      document.querySelectorAll('.step, .record, .full-list').forEach((el) => { el.style.animation = 'none'; });
      return;
    }
    sfx.drum();
    setTimeout(() => { sfx.fanfare(); burst(['🎉', '💍', '🥂', '✨', '🌸', '🏆'], 70); }, 2400);
  }

  // Danh sách đầy đủ để trao quà: hạng, tên, điểm, số câu đúng, thời gian trung bình
  function renderResults(r, p, back) {
    const ranked = rankPlayers(r.players);
    const total = r.total || QUESTIONS.length;
    const givenKey = `kh_given_${p}`;
    let given = {};
    try { given = JSON.parse(localStorage.getItem(givenKey)) || {}; } catch (e) { given = {}; }
    const avg = (pl) => (pl.correct ? fmtSec(pl.totalMs / pl.correct) : '-');
    const played = r.q >= 0 ? Math.min(r.q + 1, total) : 0;
    const date = r.createdAt ? new Date(r.createdAt).toLocaleString('vi-VN') : '';

    app.innerHTML = `<div class="screen">
      ${topbar()}
      <div class="results">
        <h2>📋 Danh sách trao quà</h2>
        <div class="meta">Phòng ${p} · ${date} · ${ranked.length} người chơi · đã chơi ${played}/${total} câu</div>
        <div class="results-actions">
          <button class="btn" id="csvBtn">⬇️ Tải file Excel</button>
          <button class="btn btn-ghost" id="printBtn">🖨️ In danh sách</button>
          <button class="btn btn-ghost" id="backBtn">← Quay lại</button>
        </div>
        <div class="table-wrap"><table class="res">
          <thead><tr><th>Hạng</th><th>Người chơi</th><th class="num">Điểm</th><th class="num">Câu đúng</th><th class="num">TB mỗi câu đúng</th><th>Đã trao quà</th></tr></thead>
          <tbody>${ranked.map((pl, i) => `<tr class="${i < 3 ? 'top' : ''} ${given[pl.uid] ? 'given' : ''}" data-uid="${pl.uid}">
            <td>${['🥇', '🥈', '🥉'][i] || i + 1}</td>
            <td>${avatarHtml(pl.animal)} ${escapeHtml(pl.name)}</td>
            <td class="num">${fmtScore(pl.score)}</td>
            <td class="num">${pl.correct || 0}/${played}</td>
            <td class="num">${avg(pl)}</td>
            <td><input type="checkbox" ${given[pl.uid] ? 'checked' : ''} aria-label="Đã trao quà cho ${escapeHtml(pl.name)}"></td>
          </tr>`).join('') || '<tr><td colspan="6" style="text-align:center">Chưa có người chơi</td></tr>'}</tbody>
        </table></div>
      </div>
    </div>`;
    bindCommon();
    app.querySelectorAll('tbody input').forEach((cb) => {
      cb.onchange = () => {
        const tr = cb.closest('tr');
        given[tr.dataset.uid] = cb.checked;
        tr.classList.toggle('given', cb.checked);
        localStorage.setItem(givenKey, JSON.stringify(given));
      };
    });
    document.getElementById('backBtn').onclick = back;
    document.getElementById('printBtn').onclick = () => window.print();
    document.getElementById('csvBtn').onclick = () => {
      const esc = (v) => `"${String(v).replace(/"/g, '""')}"`;
      const rows = [['Hạng', 'Con vật', 'Tên', 'Điểm', 'Số câu đúng', 'Thời gian TB mỗi câu đúng (giây)', 'Đã trao quà']]
        .concat(ranked.map((pl, i) => [i + 1, avatarText(pl.animal), pl.name, pl.score, `${pl.correct || 0}/${played}`,
          pl.correct ? (pl.totalMs / pl.correct / 1000).toFixed(2) : '', given[pl.uid] ? 'x' : '']));
      const csv = '\ufeff' + rows.map((row) => row.map(esc).join(',')).join('\r\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      a.download = `ket-qua-mini-game-${p}.csv`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
  }
</script>
