<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#D4798A">
<meta name="robots" content="noindex">
<title>MC điều khiển | Ai Là Triệu Phú</title>
<link rel="icon" href="../../assets/icons/mc.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/live.css">
<link rel="stylesheet" href="../../shared/couple-bg.css">
<style>
  .screen { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: 14px 14px 24px; max-width: 560px; margin: 0 auto; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
  .head .title { font-weight: 800; font-size: 1rem; }
  .head .title small { display: block; font-weight: 600; opacity: 0.85; font-size: 0.75rem; }
  .badge { background: rgba(255,255,255,0.22); border-radius: 9999px; padding: 6px 12px; font-weight: 700; font-size: 0.78rem; white-space: nowrap; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: rgba(255,255,255,0.18); border-radius: 16px; padding: 4px; margin-bottom: 12px; }
  .tabs button { border: 0; border-radius: 12px; padding: 10px 4px; background: transparent; color: #fff; font: 700 0.85rem Montserrat, sans-serif; cursor: pointer; }
  .tabs button.on { background: #fff; color: var(--deep); }
  .card { background: #fff; color: var(--ink); border-radius: 20px; padding: 16px; margin-bottom: 12px; box-shadow: 0 8px 20px rgba(120,40,70,0.15); }
  .card h2 { font-size: 1.05rem; font-weight: 800; margin-bottom: 8px; }
  .muted { color: rgba(44,62,99,0.65); font-size: 0.85rem; line-height: 1.5; }
  .big-num { font-size: 2.6rem; font-weight: 800; color: var(--deep); line-height: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { border: 1.5px solid #F3D9E0; background: #FFF7F9; border-radius: 9999px; padding: 6px 12px 6px 8px; font: 700 0.9rem Montserrat, sans-serif; color: var(--ink); cursor: pointer; }
  .q-text { font-weight: 800; font-size: 1.1rem; line-height: 1.35; margin: 4px 0 10px; }
  .opt { display: flex; align-items: center; gap: 10px; border-radius: 14px; padding: 10px 12px; margin-top: 8px; color: #fff; font-weight: 700; font-size: 0.92rem; line-height: 1.35; position: relative; overflow: hidden; }
  .opt .shape { flex: none; width: 1.3rem; text-align: center; }
  .opt .cnt { margin-left: auto; font-weight: 800; }
  .opt.dim { opacity: 0.4; }
  .opt.correct { outline: 3px solid var(--ink); }
  .opt .bar { position: absolute; left: 0; bottom: 0; height: 4px; background: rgba(255,255,255,0.75); }
  .timer-row { display: flex; align-items: center; gap: 10px; }
  .timebar { flex: 1; height: 10px; background: #F3D9E0; border-radius: 9999px; overflow: hidden; }
  .timebar div { height: 100%; background: var(--main); border-radius: 9999px; }
  .sec { font-weight: 800; font-size: 1.3rem; color: var(--deep); min-width: 2.2em; text-align: right; }
  .actions { display: grid; gap: 10px; margin-top: auto; padding-top: 6px; }
  .actions .btn { width: 100%; }
  .btn-main { background: #fff; color: var(--deep); font-size: 1.1rem; padding: 18px; }
  .btn-danger { background: rgba(0,0,0,0.18); color: #fff; box-shadow: none; font-size: 0.9rem; }
  .rank-row { display: grid; grid-template-columns: 2.2em 1.8em 1fr auto; align-items: center; gap: 8px; padding: 10px 2px; border-top: 1px solid #F6E3E8; font-weight: 700; font-size: 0.92rem; }
  .rank-row:first-of-type { border-top: 0; }
  .rank-row .rk { text-align: center; color: var(--deep); font-weight: 800; }
  .rank-row .sub { display: block; font-weight: 600; font-size: 0.75rem; color: rgba(44,62,99,0.6); }
  .rank-row .sc { text-align: right; font-weight: 800; }
  .rank-row input { width: 22px; height: 22px; accent-color: var(--main); }
  .rank-row.given { opacity: 0.45; }
  .rank-row.given .nm { text-decoration: line-through; }
  .res-row { grid-template-columns: 2.2em 1.8em 1fr auto auto; }
  .fast { background: #FFF7E0; border-radius: 12px; padding: 10px 12px; margin-top: 10px; font-weight: 600; font-size: 0.88rem; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 9999px; font-size: 0.85rem; font-weight: 600; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 70; }
  .toast.show { opacity: 1; }
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; }
</style>
</head>
<body class="live">
<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="../questions.js"></script>
<script src="../../shared/firebase-config.js"></script>
<script type="module">
  import { saveMcSession } from '../../shared/remote.js';
  import {
    CONFIGURED, EMU, QUESTION_MS, CHOICES, db, ref, roomRef, get, set, onValue, serverTimestamp,
    signIn, watchServerTime, serverNow, rankPlayers, fmtSec, fmtScore, escapeHtml, randomId,
    resultsData, loadGiven, saveGiven, downloadResultsCsv,
    tidyUrl,
    avatarHtml,
  } from '../../shared/live.js';
  const BASE = tidyUrl();

  const QUESTIONS = window.QUESTIONS;
  const app = document.getElementById('app');
  const params = new URLSearchParams(location.search);
  let pin = (params.get('pin') || '').replace(/\D/g, '');
  const key = params.get('key') || '';
  let uid = null;
  let room = null;
  let unsubscribe = null;
  let tab = 'control';
  let switching = false;
  let resultsPin = null; // null = phòng hiện tại; khác null = đang xem kết quả phòng cũ
  let resultsRoom = null;
  const MC_HISTORY = 'kh_mc_history';
  const loadMcHistory = () => { try { return JSON.parse(localStorage.getItem(MC_HISTORY)) || []; } catch (e) { return []; } };
  function rememberRoom(p) {
    const list = loadMcHistory().filter((x) => x.pin !== p);
    list.unshift({ pin: p, at: Date.now() });
    localStorage.setItem(MC_HISTORY, JSON.stringify(list.slice(0, 10)));
  }

  const toast = (msg) => {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
  };
  const message = (icon, title, sub = '') => {
    app.innerHTML = `<div class="screen"><div class="center"><div style="font-size:4rem">${icon}</div><h2 style="font-size:1.4rem;font-weight:800">${title}</h2><p style="opacity:0.85;line-height:1.5;max-width:320px">${sub}</p></div></div>`;
  };

  if (!CONFIGURED) message('🛠️', 'Chưa cấu hình Firebase');
  else if (!pin || !key) message('🎤', 'Thiếu mã điều khiển', 'Trên màn hình TV, ở sảnh chờ bấm "🎤 Mã điều khiển cho MC" rồi quét mã đó bằng điện thoại này.');
  else start();

  async function start() {
    message('⏳', 'Đang kết nối...');
    try {
      uid = await signIn();
    } catch (e) {
      message('😢', 'Không kết nối được', escapeHtml(e.message));
      return;
    }
    watchServerTime();
    await follow(pin);
    setInterval(tickTimer, 250);
  }

  // Đăng ký làm MC của phòng (luật Firebase kiểm tra mã bí mật), rồi theo dõi phòng
  async function follow(p) {
    try {
      await set(ref(db, `controllerClaims/${p}/${uid}`), key);
    } catch (e) {
      message('🔒', 'Mã điều khiển không đúng', 'Quét lại "🎤 Mã điều khiển cho MC" trên màn hình TV, hoặc vào trang /mc nhập lại mã phòng và mã MC.');
      return;
    }
    pin = p;
    saveMcSession(p, key, 'quiz');
    rememberRoom(p);
    resultsPin = null;
    const url = new URL(location.href);
    url.searchParams.set('pin', pin);
    history.replaceState(null, '', url);
    if (unsubscribe) unsubscribe();
    unsubscribe = onValue(roomRef(pin), async (snap) => {
      room = snap.val();
      if (room && room.movedTo && !switching) {
        // TV đã tạo phòng mới: tự chuyển theo
        switching = true;
        const next = room.movedTo;
        if (room.deleting) localStorage.setItem(MC_HISTORY, JSON.stringify(loadMcHistory().filter((x) => x.pin !== pin)));
        toast(`Đã chuyển sang phòng mới ${next}`);
        await follow(next);
        switching = false;
        return;
      }
      render();
    });
  }

  // Gửi lệnh cho TV, kèm trạng thái hiện tại để TV bỏ qua nếu đã chuyển màn hình khác
  async function send(type, extra = {}) {
    try {
      await set(roomRef(pin, 'command'), { type, id: randomId(10), status: room.status, q: room.q, at: serverTimestamp(), ...extra });
      if (navigator.vibrate) navigator.vibrate(30);
      toast('Đã gửi lệnh ✔');
    } catch (e) {
      toast('Không gửi được lệnh, thử lại nha');
    }
  }

  function render() {
    if (switching) return;
    if (!room) { message('👋', 'Phòng đã đóng', 'Quét lại "🎤 Mã điều khiển cho MC" trên TV để điều khiển phòng mới.'); return; }
    const players = rankPlayers(room.players);
    const statusText = {
      lobby: '⏳ Sảnh chờ', question: `❓ Câu ${room.q + 1}/${room.total}`, reveal: `✅ Đáp án câu ${room.q + 1}`,
      leaderboard: '🏆 Bảng xếp hạng', podium: '🎉 Kết quả chung cuộc', ended: '⏹ Đã kết thúc',
    }[room.status] || room.status;
    let body = '';
    if (tab === 'control') body = controlView(players);
    else if (tab === 'rank') body = rankView(players);
    else body = resultsView();
    app.innerHTML = `<div class="screen">
      <div class="head">
        <div class="title">🎤 MC điều khiển<small>Phòng ${pin} · 👥 ${players.length} người chơi</small></div>
        <span class="badge">${statusText}</span>
      </div>
      <div class="tabs">
        <button data-tab="control" class="${tab === 'control' ? 'on' : ''}">🎮 Điều khiển</button>
        <button data-tab="rank" class="${tab === 'rank' ? 'on' : ''}">🏆 Xếp hạng</button>
        <button data-tab="results" class="${tab === 'results' ? 'on' : ''}">📋 Trao quà</button>
      </div>
      ${body}
    </div>`;
    app.querySelectorAll('.tabs button').forEach((b) => { b.onclick = () => { tab = b.dataset.tab; render(); }; });
    bind();
    tickTimer();
  }

  function optionsHtml(cur, answerIdx, counts) {
    const max = counts ? Math.max(1, ...counts) : 1;
    return (cur.options || []).map((t, i) => {
      const c = CHOICES[i];
      const cls = counts ? (i === answerIdx ? 'correct' : 'dim') : (i === answerIdx ? 'correct' : '');
      const right = i === answerIdx ? ' ✔' : '';
      const cnt = counts ? `<span class="cnt">${counts[i]}</span><span class="bar" style="width:${(counts[i] / max) * 100}%"></span>` : '';
      return `<div class="opt ${cls}" style="background:${c.color}"><span class="shape">${c.shape}</span><span><b>${c.letter}.</b> ${escapeHtml(t)}${right}</span>${cnt}</div>`;
    }).join('');
  }

  function controlView(players) {
    const s = room.status;
    const item = QUESTIONS[room.q] || {};
    const reset = '<button class="btn btn-danger" data-act="reset">🗑️ Xóa &amp; tạo game mới</button>';

    if (s === 'lobby') {
      return `<div class="card">
          <h2>Người chơi đang vào</h2>
          <div class="big-num">${players.length}</div>
          <p class="muted">Bấm vào tên để mời người chơi ra khỏi phòng.</p>
          <div class="chips">${players.map((p) => `<button class="chip" data-kick="${p.uid}">${avatarHtml(p.animal)} ${escapeHtml(p.name)}</button>`).join('') || '<span class="muted">Đang chờ khách quét mã trên TV...</span>'}</div>
        </div>
        <div class="card"><p class="muted">🎵 Nhạc tự chạy trên TV: nếu TV chưa có tiếng, chạm hoặc bấm phím bất kỳ 1 lần trên máy TV.</p></div>
        <div class="actions">
          <button class="btn btn-main" data-act="start" ${players.length ? '' : 'disabled'}>▶ Bắt đầu game</button>
          ${reset}
        </div>`;
    }
    if (s === 'question') {
      const answered = Object.keys((room.answers && room.answers[room.q]) || {}).filter((k) => room.players && room.players[k]).length;
      return `<div class="card">
          <div class="timer-row"><div class="timebar"><div id="mcBar" style="width:100%"></div></div><span class="sec" id="mcSec">30</span></div>
          <p class="q-text">${item.emoji || ''} ${escapeHtml(item.q || '')}</p>
          ${optionsHtml(item, item.answer)}
          <p class="muted" style="margin-top:10px">✔ = đáp án đúng (chỉ MC thấy)</p>
        </div>
        <div class="card"><h2>Đã trả lời</h2><div class="big-num">${answered}<span style="font-size:1.2rem;color:var(--ink)"> / ${players.length}</span></div></div>
        <div class="actions">
          <button class="btn btn-main" data-act="skip">⏭ Hết giờ luôn</button>
          ${reset}
        </div>`;
    }
    if (s === 'reveal') {
      const rv = room.reveal;
      if (!rv) return '<div class="card"><p class="muted">Đang chấm điểm...</p></div>';
      const f = rv.fastest;
      return `<div class="card">
          <p class="q-text">${item.emoji || ''} ${escapeHtml(item.q || '')}</p>
          ${optionsHtml(item, rv.answer, rv.counts)}
          <div class="fast">${f ? `⚡ Nhanh nhất: <b>${avatarHtml(f.animal)} ${escapeHtml(f.name)}</b> · ${fmtSec(f.ms)}` : '😅 Chưa ai trả lời đúng'}</div>
          <p class="muted" style="margin-top:10px">💬 Gợi ý lời dẫn: ${escapeHtml(item.right || '')}</p>
        </div>
        <div class="actions">
          <button class="btn btn-main" data-act="board">🏆 Bảng xếp hạng →</button>
          ${reset}
        </div>`;
    }
    if (s === 'leaderboard') {
      const last = room.q >= QUESTIONS.length - 1;
      const next = QUESTIONS[room.q + 1];
      return `<div class="card"><h2>Top 5</h2>${players.slice(0, 5).map(rankRow).join('')}</div>
        ${next ? `<div class="card"><h2>Câu tiếp theo (${room.q + 2}/${QUESTIONS.length})</h2><p class="muted">${next.emoji} ${escapeHtml(next.q)}</p></div>` : ''}
        <div class="actions">
          <button class="btn btn-main" data-act="${last ? 'podium' : 'next'}">${last ? '🎉 Kết quả chung cuộc' : 'Câu tiếp theo →'}</button>
          ${reset}
        </div>`;
    }
    if (s === 'podium') {
      const medals = ['🥇', '🥈', '🥉'];
      const r = room.record;
      return `<div class="card"><h2>🎉 Top 3</h2>${players.slice(0, 3).map((p, i) => `<div class="rank-row"><span class="rk">${medals[i]}</span><span>${avatarHtml(p.animal)}</span><span>${escapeHtml(p.name)}</span><span class="sc">${fmtScore(p.score)}</span></div>`).join('')}
          ${r ? `<div class="fast">⚡ Tay nhanh nhất game: <b>${avatarHtml(r.animal)} ${escapeHtml(r.name)}</b> · câu ${r.q + 1} · ${fmtSec(r.ms)}</div>` : ''}</div>
        <div class="actions">
          <button class="btn btn-main" data-tab-go="results">📋 Danh sách trao quà</button>
          <button class="btn btn-danger" data-act="newroom">🔁 Phòng mới (giữ kết quả phòng này)</button>
          ${reset}
        </div>`;
    }
    return `<div class="card"><p class="muted">Phòng đã kết thúc.</p></div>`;
  }

  function rankRow(p, i) {
    const streak = p.streak >= 2 ? ` 🔥${p.streak}` : '';
    return `<div class="rank-row"><span class="rk">${i + 1}</span><span>${avatarHtml(p.animal)}</span><span>${escapeHtml(p.name)}${streak}<span class="sub">${p.correct || 0} câu đúng</span></span><span class="sc">${fmtScore(p.score)}</span></div>`;
  }

  function rankView(players) {
    return `<div class="card"><h2>🏆 Xếp hạng trực tiếp</h2>${players.map(rankRow).join('') || '<p class="muted">Chưa có người chơi</p>'}</div>`;
  }

  function resultsView() {
    const viewPin = resultsPin || pin;
    const r = resultsPin ? resultsRoom : room;
    const others = loadMcHistory().filter((x) => x.pin !== pin);
    const picker = others.length ? `<div class="chips" style="margin:0 0 12px">
        <button class="chip" data-res="" style="${resultsPin ? '' : 'background:#fff;border-color:var(--main)'}">Phòng đang chơi ${pin}</button>
        ${others.map((x) => `<button class="chip" data-res="${x.pin}" style="${resultsPin === x.pin ? 'background:#fff;border-color:var(--main)' : ''}">Phòng ${x.pin} · ${new Date(x.at).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })}</button>`).join('')}
      </div>` : '';
    if (!r) return `${picker}<div class="card"><p class="muted">Phòng ${viewPin} không còn dữ liệu (đã bị xóa).</p></div>`;
    const { rows, played, total, date } = resultsData(r);
    const given = loadGiven(viewPin);
    return `${picker}<div class="card">
        <h2>📋 Danh sách trao quà</h2>
        <p class="muted">Phòng ${viewPin} · ${date} · đã chơi ${played}/${total} câu. Tick vào ô khi đã trao quà.</p>
        ${rows.map((p) => `<div class="rank-row res-row ${given[p.uid] ? 'given' : ''}" data-uid="${p.uid}">
          <span class="rk">${p.medal}</span><span>${avatarHtml(p.animal)}</span>
          <span class="nm">${escapeHtml(p.name)}<span class="sub">${p.correct}/${played} câu đúng · TB ${p.avg}</span></span>
          <span class="sc">${fmtScore(p.score)}</span>
          <input type="checkbox" ${given[p.uid] ? 'checked' : ''} aria-label="Đã trao quà cho ${escapeHtml(p.name)}">
        </div>`).join('') || '<p class="muted">Chưa có người chơi</p>'}
      </div>
      <div class="actions"><button class="btn btn-main" data-act="csv">⬇️ Tải file Excel</button></div>`;
  }

  function bind() {
    app.querySelectorAll('[data-act]').forEach((b) => {
      b.onclick = () => {
        const act = b.dataset.act;
        if (act === 'csv') { downloadResultsCsv(resultsPin ? resultsRoom : room, resultsPin || pin); return; }
        if (act === 'reset' && !confirm('Xóa toàn bộ người chơi, điểm của phòng này và tạo game mới? (Mất danh sách trao quà của phòng này)')) return;
        if (act === 'newroom' && !confirm('Tạo phòng mới? Kết quả phòng này vẫn xem lại được trong tab "Trao quà".')) return;
        b.disabled = true;
        send(act);
        setTimeout(() => { b.disabled = false; }, 1500);
      };
    });
    app.querySelectorAll('[data-kick]').forEach((b) => {
      b.onclick = () => {
        const p = room.players && room.players[b.dataset.kick];
        if (p && confirm(`Mời "${p.name}" ra khỏi phòng?`)) send('kick', { uid: b.dataset.kick });
      };
    });
    app.querySelectorAll('[data-res]').forEach((b) => {
      b.onclick = async () => {
        resultsPin = b.dataset.res || null;
        resultsRoom = resultsPin ? (await get(roomRef(resultsPin))).val() : null;
        render();
      };
    });
    app.querySelectorAll('[data-tab-go]').forEach((b) => { b.onclick = () => { tab = b.dataset.tabGo; render(); }; });
    app.querySelectorAll('.res-row input').forEach((cb) => {
      cb.onchange = () => {
        const row = cb.closest('.res-row');
        const viewPin = resultsPin || pin;
        const given = loadGiven(viewPin);
        given[row.dataset.uid] = cb.checked;
        saveGiven(viewPin, given);
        row.classList.toggle('given', cb.checked);
      };
    });
  }

  function tickTimer() {
    const bar = document.getElementById('mcBar');
    if (!bar || !room || room.status !== 'question' || typeof room.qStartAt !== 'number') return;
    const left = Math.max(0, room.qStartAt + QUESTION_MS - serverNow());
    bar.style.width = (left / QUESTION_MS) * 100 + '%';
    document.getElementById('mcSec').textContent = Math.ceil(left / 1000) + 's';
  }
</script>
</body>
</html>
